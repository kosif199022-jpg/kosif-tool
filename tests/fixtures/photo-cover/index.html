<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<title>photo cover fixture — five camera styles</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
<script src="../../../tools/photo_cover.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Test page for tools/check_frame_cover.cjs: five lyric-video camera styles drawn
// through KosifCover, on a generated photo of any size (?aspect=941x1672).
// ?naive=1 draws the way the bug did (scale to the frame width, then clamp only
// the position), so the checker must FAIL on it for tall or short photos.
const W = 1080, H = 1920, DUR = 6, FPS = 30;
const Q = new URLSearchParams(location.search);
const STYLE = +(Q.get('style') || 1), NAIVE = Q.get('naive') === '1';
const [IW, IH] = (Q.get('aspect') || '941x1672').split('x').map(Number);
const ctx = document.getElementById('c').getContext('2d');
const ease = (x) => x * x * (3 - 2 * x), cl = (x) => Math.max(0, Math.min(1, x));
const shake = (t, a) => [a * (1.6 * Math.sin(t * 2.1) + 0.9 * Math.sin(t * 5.3 + 1.3)), a * (1.6 * Math.sin(t * 1.7 + 2) + 0.9 * Math.sin(t * 4.9 + 0.7))];

// a "photo": opaque gradient + grain, and a cutout of a figure with transparent surroundings
function makePhoto(cut) {
  const c = document.createElement('canvas'); c.width = IW; c.height = IH;
  const g = c.getContext('2d');
  if (!cut) {
    const gr = g.createLinearGradient(0, 0, IW, IH); gr.addColorStop(0, '#222'); gr.addColorStop(1, '#ddd');
    g.fillStyle = gr; g.fillRect(0, 0, IW, IH);
    let s = 7; const R = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let k = 0; k < 2000; k++) { g.fillStyle = `rgba(255,255,255,${R() * 0.2})`; g.fillRect(R() * IW, R() * IH, 3, 3); }
  } else {
    g.fillStyle = '#eee'; g.beginPath(); g.ellipse(IW / 2, IH * 0.55, IW * 0.22, IH * 0.3, 0, 0, 6.283); g.fill();
  }
  return createImageBitmap(c);
}
let photo, subject;
const ready = Promise.all([makePhoto(false), makePhoto(true)]).then(([a, b]) => { photo = a; subject = b; });

// the buggy camera: width-fit scale, zoom may drop below 1, position clamp ignores rotation and blur
function naiveDraw(img, z, fx, fy, ox, oy, rot, blur) {
  const IS = W / IW, iw = IW * IS * z, ih = IH * IS * z;
  let x = W / 2 - fx * iw + ox, y = H / 2 - fy * ih + oy;
  x = Math.min(0, Math.max(W - iw, x)); y = Math.min(0, Math.max(H - ih, y));
  ctx.save(); if (blur) ctx.filter = `blur(${blur}px)`;
  ctx.translate(W / 2, H / 2); ctx.rotate(rot * Math.PI / 180); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(img, x, y, iw, ih); ctx.restore();
}
function shot(img, o) {
  if (NAIVE) return naiveDraw(img, o.zoom ?? 1, o.fx ?? .5, o.fy ?? .5, o.ox || 0, o.oy || 0, o.rot || 0, o.blur || 0);
  KosifCover.drawPhoto(ctx, img, Object.assign({ W, H }, o));
}

const STYLES = {
  // 1 slow push-in (Ken Burns) toward the face
  1: (t) => shot(photo, { zoom: 1 + 0.18 * ease(cl(t / DUR)), fx: 0.5, fy: 0.5 - 0.15 * ease(cl(t / DUR)) }),
  // 2 long pan across the photo at cover zoom: mode 'zoom' adds just enough zoom to keep moving
  2: (t) => shot(photo, { zoom: 1, fx: 0.15 + 0.7 * ease(cl(t / DUR)), fy: 0.4, mode: 'zoom' }),
  // 3 pull-out that asks for less than cover at the end (zoom 0.85): the floor holds it at cover
  3: (t) => shot(photo, { zoom: 1.4 - 0.55 * ease(cl(t / DUR)), fx: 0.5, fy: 0.3 }),
  // 4 handheld: shake, drifting rotation and a focus blur that racks in and out
  4: (t) => { const [sx, sy] = shake(t, 9); shot(photo, { zoom: 1.03, ox: sx, oy: sy, rot: 2.5 * Math.sin(t * 0.9), blur: 6 * Math.abs(Math.sin(t * 0.7)) }); },
  // 5 parallax: background travels and zooms less than the cut-out subject, beat punch on top
  5: (t) => {
    const p = ease(cl(t / DUR)), punch = 1 + 0.03 * Math.exp(-((t * 2) % 1) * 9);
    shot(photo, { zoom: (1 + 0.08 * p) * punch, ox: -60 * p, fy: 0.45, blur: 3 });
    shot(subject, { zoom: (1 + 0.2 * p) * punch, ox: -140 * p, fy: 0.45 });
  },
};
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  (STYLES[STYLE] || STYLES[1])(t);
  // lyric band and vignette on top, like the real films
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
window.__kosif = { duration: DUR, fps: FPS, seek: async (t) => { await ready; render(t); } };
window.__kosifReady = ready;
</script>
</body></html>

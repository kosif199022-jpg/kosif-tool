<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Lyrics</title>
<link rel="stylesheet" href="fonts/all.css">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;object-fit:contain}
#play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:700 28px "Reem Kufi",sans-serif;background:rgba(0,0,0,.5);cursor:pointer}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lyrics.js"></script>
<script>
// Neon Arabic lyric film, 1080x1920. Rendering techniques (tube ghost/colour/core layers, low-res saturated halos,
// sign-lit brick with rim light, wet-pavement reflection) adapted from the AI Style Atlas "Neon Sign at Night"
// reference supplied by the user. Every frame is a pure function of t.
'use strict';
const W = 1080, HH = 1920, WALL = 1404, FPS = 30;
const DATA = window.LYRICS;               // {duration, lines:[{p,y,size,font,c,w:[[word,t]]}], env30:[...]}
const DUR = DATA.duration;

// ---------- helpers (from the atlas H library) ----------
const H = {};
H.rng = function (seed = 1) {
  let a = (seed >>> 0) || 1;
  const r = () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + r() * (hi - lo); return r;
};
H.makeNoise = function (seed = 1) {
  const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;
  const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
  function n3(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
      lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  }
  return { n3, n2: (x, y) => n3(x, y, 0.5) };
};
H.lerp = (a, b, t) => a + (b - a) * t;
H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
H.ease = { inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), out: (t) => 1 - Math.pow(1 - t, 3) };
H.rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
H.mix = (a, b, t) => [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t);
H.layer = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

const NX = { pink: [255, 70, 165], cyan: [70, 228, 255], warm: [255, 190, 70], red: [255, 48, 36], green: [90, 255, 120], violet: [175, 110, 255], white: [255, 236, 214] };
const FONTS = { kufi: (s) => `600 ${s}px "Marhey"`, ruqaa: (s) => `700 ${s}px "Aref Ruqaa"`, marhey: (s) => `700 ${s}px "Marhey"` };
const hs = (n) => { const v = Math.sin(n * 91.731 + 7.13) * 43758.5453; return v - Math.floor(v); };
const sm = H.smooth, E = H.ease;

// ---------- static textures (built once) ----------
let brickTile = null, edgeTile = null, pave = null, grainTiles = null;
const BR = { w: 108, h: 36, cols: 12, rows: 39, mort: 6 };
function brickHash(a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }
function buildBrick() {
  const TW = BR.w * BR.cols, TH = BR.h * BR.rows, c = H.layer(TW, TH), x = c.getContext('2d'), img = x.createImageData(TW, TH), d = img.data;
  const e = H.layer(TW, TH), ex = e.getContext('2d'), eimg = ex.createImageData(TW, TH), ed = eimg.data;
  const R = H.rng(4401), nz = H.makeNoise(4402);
  const cols = [[226, 104, 76], [198, 88, 64], [240, 128, 92], [176, 94, 76], [216, 118, 88], [136, 74, 60], [205, 112, 84]];
  for (let y = 0; y < TH; y++) {
    const row = Math.floor(y / BR.h), ly = y - row * BR.h, off = (row % 2) * (BR.w / 2);
    for (let xx = 0; xx < TW; xx++) {
      const col = Math.floor((xx + off) / BR.w) % BR.cols, lxp = (xx + off) % BR.w;
      const h1 = brickHash(row, col), h2 = brickHash(col + 9, row + 3), g = R() - 0.5;
      const ang = xx / TW * Math.PI * 2, st = nz.n3(Math.cos(ang) * 3, Math.sin(ang) * 3, y * 0.011) * 0.3;
      const ej = (brickHash(xx >> 2, row) - 0.5) * 2.4;
      const i = (y * TW + xx) * 4;
      let r, gg, b;
      if (ly < BR.mort + ej * 0.5 || lxp < BR.mort + ej * 0.6) { const m = 0.5 + g * 0.3; r = 188 * m; gg = 180 * m; b = 170 * m; }
      else {
        const c0 = cols[Math.floor(h1 * cols.length)];
        const k = (0.85 + h2 * 0.3 + st) * (1 + g * 0.3) * (brickHash(xx * 0.37 | 0, y * 0.41 | 0) > 0.985 ? 0.55 : 1) * (ly - BR.mort < 3 ? 1.15 : BR.h - ly < 3 ? 0.75 : 1);
        r = c0[0] * k; gg = c0[1] * k; b = c0[2] * k;
        const top = ly - (BR.mort + ej * 0.5), bot = BR.h - ly;
        if (top < 3.5) { ed[i] = ed[i + 1] = ed[i + 2] = 255; ed[i + 3] = 255 * (1 - top / 3.5) * (lxp - BR.mort < 2 ? 0.5 : 1); }
        else if (bot < 3) { ed[i] = ed[i + 1] = ed[i + 2] = 255; ed[i + 3] = 140 * (1 - bot / 3); }
      }
      d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0); ex.putImageData(eimg, 0, 0);
  // rain streak darkening (wet wall)
  x.globalCompositeOperation = 'multiply';
  for (let k = 0; k < 90; k++) { const sx = R() * TW, w = 6 + R() * 30, g2 = x.createLinearGradient(0, 0, 0, TH); g2.addColorStop(0, 'rgba(120,110,120,0)'); g2.addColorStop(R(), 'rgba(120,110,130,0.5)'); g2.addColorStop(1, 'rgba(120,110,120,0)'); x.fillStyle = g2; x.fillRect(sx, 0, w, TH); }
  brickTile = c; edgeTile = e;
}
function buildPave() {
  const PW = W * 2, PH = HH - WALL, nz = H.makeNoise(4410), R = H.rng(4411);
  const c = H.layer(PW, PH), x = c.getContext('2d'), img = x.createImageData(PW, PH), d = img.data;
  const p = H.layer(PW, PH), px = p.getContext('2d'), pimg = px.createImageData(PW, PH), pd = pimg.data;
  for (let y = 0; y < PH; y++) for (let xx = 0; xx < PW; xx++) {
    const a = xx / PW * Math.PI * 2, cx0 = Math.cos(a), sx0 = Math.sin(a), persp = 1 + y / PH * 2;
    const g = R() - 0.5, st = nz.n3(cx0 * 9, sx0 * 9, y * 0.03 / persp * 2) * 0.5 + nz.n3(cx0 * 40, sx0 * 40, y * 0.12) * 0.3;
    let base = 22 + g * 12 + st * 9;
    if (y < 6) base = 58 + g * 14 - y * 3; else if (y < 18) base = 42 + g * 14 - (y - 6) * 1.4;
    base *= 1 - y / PH * 0.3;
    const i = (y * PW + xx) * 4; d[i] = base * 0.92; d[i + 1] = base * 0.95; d[i + 2] = base * 1.1; d[i + 3] = 255;
    const v = nz.n3(cx0 * 3.5, sx0 * 3.5, y * 0.012 + 20) + 0.4 * nz.n3(cx0 * 10, sx0 * 10, y * 0.03);
    pd[i] = pd[i + 1] = pd[i + 2] = 255; pd[i + 3] = 255 * H.smooth(-0.15, 0.06, v) * H.smooth(10, 30, y);
  }
  x.putImageData(img, 0, 0); px.putImageData(pimg, 0, 0);
  for (let k = 0; k < 4200; k++) { x.fillStyle = `rgba(200,200,220,${R() * 0.16})`; x.fillRect(R() * PW, 18 + Math.pow(R(), 0.8) * (PH - 18), 1 + R() * 1.5, 1); }
  pave = { c, p, PW, PH };
}
function buildGrain() {
  grainTiles = [];
  for (let k = 0; k < 6; k++) {
    const c = H.layer(540, 960), x = c.getContext('2d'), img = x.createImageData(540, 960), d = img.data, R = H.rng(900 + k);
    for (let i = 0; i < d.length; i += 4) { const v = 128 + (R() - 0.5) * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    x.putImageData(img, 0, 0); grainTiles.push(c);
  }
}

// ---------- reusable frame layers ----------
const L = {};
['col', 'txt', 'core', 'off', 'F'].forEach((k) => (L[k] = H.layer(W, HH)));
const G = {}; for (const k in L) G[k] = L[k].getContext('2d');
const scratch = H.layer(W, HH), sx2 = scratch.getContext('2d');
function blurSmall(src, px, s, sat = 1, w = W, h = HH) {
  const c = H.layer(Math.ceil(w * s), Math.ceil(h * s)), x = c.getContext('2d');
  x.filter = `blur(${Math.max(0.5, px * s)}px)` + (sat !== 1 ? ` saturate(${sat})` : ''); x.drawImage(src, 0, 0, w, h, 0, 0, c.width, c.height); return c;
}

// ---------- layout of lyric lines (after fonts load) ----------
const ctxM = G.txt;
function layoutLines() {
  for (const ln of DATA.lines) {
    const fam = FONTS[ln.font || 'kufi'];
    let size = ln.size;
    const gap = () => size * 0.28;
    const measure = () => { ctxM.font = fam(size); return ln.w.map(([s]) => ctxM.measureText(s).width); };
    let ws = measure(), tot = ws.reduce((a, b) => a + b, 0) + gap() * (ws.length - 1);
    const maxW = ln.maxW || 900;
    if (tot > maxW) { size = Math.floor(size * maxW / tot); ws = measure(); tot = ws.reduce((a, b) => a + b, 0) + gap() * (ws.length - 1); }
    // RTL: first word at the right
    let x = (ln.x || 540) + tot / 2; ln.fontStr = fam(size); ln.fsize = size; ln.pos = [];
    ws.forEach((w) => { ln.pos.push([x - w, w]); x -= w + gap(); });
    ln.t0 = ln.w[0][1];
  }
}

// ---------- scene ----------
const PANEL_T = [0, 7.42, 15.22, 22.95, 30.2, 37.98];       // pan start times into panel i
const PAN_LEN = [0, 0.38, 0.38, 0.38, 0.32, 0.3];
function camAt(t) { let c = 0; for (let i = 1; i < PANEL_T.length; i++) c += W * E.inOut(sm(PANEL_T[i], PANEL_T[i] + PAN_LEN[i], t)); return c; }
function envAt(t) { const e = DATA.env30 || []; if (!e.length) return 0.5; const i = H.clamp(t * 30, 0, e.length - 1), a = Math.floor(i), b = Math.min(e.length - 1, a + 1); return H.lerp(e[a], e[b], i - a); }

function drawFrame(ctx, t) {
  const cam = camAt(t);
  const ign = (t0, len = 0.3) => t < t0 ? 0 : t - t0 > len ? 1 : (hs(Math.floor(t * 40) + t0 * 977) > 0.42 ? 1 : 0.06);
  const down = (t1, len = 0.28) => t < t1 ? 1 : t - t1 > len ? 0 : (hs(Math.floor(t * 40) + t1 * 331) > 0.5 ? 1 : 0.1);
  const END = DUR - 0.62; // everything but the last word + finale heart powers down here
  const endK = down(END);
  for (const k in G) { const g = G[k]; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none'; g.clearRect(0, 0, W, HH); }
  const { col: cx, txt: tx, core: kx, off: ox } = G;
  [cx, tx, kx, ox].forEach((g) => { g.lineCap = 'round'; g.lineJoin = 'round'; g.translate(-cam, 0); });
  cx.globalCompositeOperation = 'lighter'; kx.globalCompositeOperation = 'lighter';
  let tb = null; // screen bbox of lit text, for core erosion
  const HW = { clips: [], elec: [] };
  const clip = (x, y, a = 0) => HW.clips.push([x, y, a]);
  const elec = (x, y, a) => HW.elec.push([x, y, a]);
  const seen = (X) => Math.abs(cam - X) < 1250;

  // glass tube: dark unlit glass always, colour + hot core when lit; prog draws it on along its length
  const tube = (pathFn, c, k, w = 7, prog = 1, len = 2400) => {
    ox.strokeStyle = 'rgb(44,36,48)'; ox.lineWidth = w; pathFn(ox); ox.stroke();
    ox.strokeStyle = 'rgba(170,160,180,0.2)'; ox.lineWidth = w * 0.3; ox.save(); ox.translate(-1, -1.5); pathFn(ox); ox.stroke(); ox.restore();
    if (k <= 0 || prog <= 0) return;
    const dash = prog < 1 ? [len * prog, len * 2] : [];
    cx.setLineDash(dash); kx.setLineDash(dash);
    cx.strokeStyle = H.rgba(c, Math.min(1, k)); cx.lineWidth = w * (k > 1 ? 1 + (k - 1) * 0.6 : 1); pathFn(cx); cx.stroke();
    kx.strokeStyle = H.rgba(H.mix(c, [255, 255, 255], 0.82), Math.min(1, k)); kx.lineWidth = w * 0.36; pathFn(kx); kx.stroke();
    cx.setLineDash([]); kx.setLineDash([]);
  };
  const word = (s, x, y, font, c, k, lw = 3.4) => {
    ox.font = font; ox.textAlign = 'left'; ox.direction = 'rtl'; ox.lineWidth = lw; ox.fillStyle = ox.strokeStyle = 'rgb(44,36,48)';
    ox.textAlign = 'left'; ox.direction = 'ltr'; ox.fillText(s, x, y); ox.strokeText(s, x, y);
    if (k <= 0) return;
    const fs = +(font.match(/(\d+)px/) || [0, 60])[1]; tx.font = font; const w = tx.measureText(s).width, pad = 14;
    const b = [x - cam - pad, y - fs * 1.25 - pad, x - cam + w + pad, y + fs * 0.7 + pad];
    tb = tb ? [Math.min(tb[0], b[0]), Math.min(tb[1], b[1]), Math.max(tb[2], b[2]), Math.max(tb[3], b[3])] : b;
    const boost = Math.min(1, k);
    for (const [g, cc, l] of [[cx, c, lw + (k > 1 ? (k - 1) * 8 : 0) + 3], [tx, H.mix(c, [255, 255, 255], 0.85), lw]]) {
      g.font = font; g.textAlign = 'left'; g.direction = 'ltr'; g.lineWidth = l; g.fillStyle = g.strokeStyle = H.rgba(cc, boost);
      g.fillText(s, x, y); g.strokeText(s, x, y);
    }
  };
  const quadPt = (x0, y0, qx, qy, x1, y1, u) => [(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * qx + u * u * x1, (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * qy + u * u * y1];

  // ---- lyric lines: words ignite on the sung word, overdrive flash, older lines rest dimmer ----
  const lines = DATA.lines;
  for (let li = 0; li < lines.length; li++) {
    const ln = lines[li], X = ln.p * W;
    if (!seen(X)) continue;
    const later = lines.find((o, j) => j > li && o.p === ln.p && !o.overlay);
    const rest = later && !ln.overlay ? 1 - 0.42 * sm(later.t0 - 0.05, later.t0 + 0.35, t) : 1;
    const keep = ln.final ? 1 : endK;
    ln.w.forEach(([s, t0, opt], i) => {
      let k = ign(t0, 0.32);
      if (k > 0) k *= 1 + 0.55 * Math.exp(-(t - t0) * 4.5);         // ignition overdrive on the sung word
      if (opt === 'fail' && t > t0 + 0.4) k = hs(Math.floor(t * 11) + 3) > 0.33 ? 1 : 0.12; // the tube that never settles
      if (opt === 'strike' && t > t0 + 0.4) k *= 0.55;
      const c = opt === 'fail' ? NX.red : NX[ln.c];
      word(s, X + ln.pos[i][0], ln.y, ln.fontStr, c, k * rest * keep, ln.lw || 3.4);
      if (opt === 'strike') { // red strike-through tube on "كلام"
        const x0 = X + ln.pos[i][0] - 14, x1 = x0 + ln.pos[i][1] + 28, yy = ln.y - ln.fsize * 0.32;
        tube((g) => { g.beginPath(); g.moveTo(x1, yy - 10); g.lineTo(x0, yy + 12); }, NX.red, ign(t0 + 0.45) * keep, 9, sm(t0 + 0.45, t0 + 0.75, t), 300);
        elec(x1 + 4, yy - 11, 0); elec(x0 - 4, yy + 13, Math.PI);
      }
    });
    // electrodes at both ends of each sign line
    const xr = X + ln.pos[0][0] + ln.pos[0][1] + 18, xl = X + ln.pos[ln.pos.length - 1][0] - 18;
    elec(xr, ln.y - ln.fsize * 0.3, 0); elec(xl, ln.y - ln.fsize * 0.3, Math.PI);
  }

  // ================= P0: the two eyes (العينين سابقة الكلام / وأنا عيني ليك) =================
  if (seen(0)) {
    const blinkAt = [2.25, 4.55, 6.95, 9.0];
    let open = sm(0.0, 0.7, t);
    for (const b of blinkAt) open *= 1 - Math.exp(-Math.pow((t - b) / 0.07, 2));
    const look = Math.sin(t * 0.9) * 22 + (t > 3.9 && t < 5.4 ? -14 : 0);
    const draw = sm(0.0, 1.1, t), heartEyes = t > 3.94;
    for (const [ex, side] of [[330, -1], [750, 1]]) {
      const ey = 470, w2 = 165, hu = H.lerp(-62, 92, open), hl = 66;
      const almond = (g) => { g.beginPath(); g.moveTo(ex - w2, ey); g.quadraticCurveTo(ex, ey - 2 * hu, ex + w2, ey); g.quadraticCurveTo(ex, ey + 2 * hl, ex - w2, ey); };
      tube(almond, NX.cyan, ign(0.05) * endK, 9, draw, 900);
      // lashes on the upper lid
      for (let i = 0; i < 5; i++) {
        const u = 0.2 + i * 0.15, p = quadPt(ex - w2, ey, ex, ey - 2 * hu, ex + w2, ey, u), nx = (u - 0.5) * 0.9;
        const len = 30 * H.clamp(open * 1.3);
        if (len > 2) tube((g) => { g.beginPath(); g.moveTo(p[0], p[1] - 6); g.lineTo(p[0] + nx * len, p[1] - 6 - len); }, NX.cyan, ign(0.4 + i * 0.05) * endK, 5);
      }
      if (open > 0.45) {
        const ix = ex + look, iy = ey + 4, ik = ign(0.75) * H.clamp((open - 0.45) * 3) * endK;
        tube((g) => { g.beginPath(); g.arc(ix, iy, 56, 0, Math.PI * 2); }, NX.warm, ik, 7);
        if (heartEyes) { const s = 22 * (1 + 0.15 * Math.max(0, Math.sin(t * 8.6))); tube((g) => heartPath(g, ix, iy + 2, s), NX.pink, ign(3.94) * ik, 6); }
        else tube((g) => { g.beginPath(); g.arc(ix, iy, 18, 0, Math.PI * 2); }, NX.warm, ik, 6);
      }
      // brow
      tube((g) => { g.beginPath(); g.moveTo(ex - 130, ey - 150 - (side > 0 ? 6 : 0)); g.quadraticCurveTo(ex, ey - 205 - open * 10, ex + 130, ey - 150); }, NX.violet, ign(1.0) * endK, 7, sm(1.0, 1.6, t), 400);
      elec(ex - w2 - 12, ey, Math.PI); clip(ex, ey + hl, 0);
    }
  }

  // ================= P1: nights (نفسي أعيش كل الليالي وياك) =================
  const X1 = W;
  if (seen(X1)) {
    const mx = X1 + 690, my = 410, mr = 175;
    // crescent: outer circle minus an offset inner circle, joined at their two intersections
    const ix = mx + 95, iy = my - 60, ir = mr * 0.88, dd = Math.hypot(ix - mx, iy - my), base = Math.atan2(iy - my, ix - mx);
    const ao = Math.acos((mr * mr + dd * dd - ir * ir) / (2 * mr * dd)), ai = Math.acos((ir * ir + dd * dd - mr * mr) / (2 * ir * dd));
    const moon = (g) => { g.beginPath(); g.arc(mx, my, mr, base + ao, base - ao + 2 * Math.PI, false); g.arc(ix, iy, ir, base + Math.PI + ai, base + Math.PI - ai, true); g.closePath(); };
    tube(moon, NX.warm, ign(7.75) * endK, 9, sm(7.75, 8.9, t), 1700);
    const stars = [[X1 + 250, 250, 34], [X1 + 410, 420, 22], [X1 + 200, 560, 26], [X1 + 900, 260, 20], [X1 + 440, 190, 16], [X1 + 920, 640, 24], [X1 + 330, 690, 15]];
    stars.forEach(([sx, sy, r], i) => {
      const t0 = 9.98 + i * 0.11, tw = 0.75 + 0.25 * Math.sin(t * 5 + i * 2.1);
      tube((g) => starPath(g, sx, sy, r, t * 0.3 + i), i % 2 ? NX.cyan : NX.white, ign(t0) * tw * endK, 5);
    });
    // small zzz-free "nights" counter: a row of tick marks that light up per night (beat-synced)
    for (let i = 0; i < 9; i++) {
      const bx = X1 + 210 + i * 82, t0 = 10.56 + i * 0.2;

}
function starPath(g, cx, cy, r, rot) {

  g.closePath();
}

    const btn = document.createElement('div'); btn.id = 'play'; btn.textContent = '▶ تشغيل'; document.body.appendChild(btn);
    const au = new Audio(DATA.audio || 'audio.m4a');
    btn.onclick = () => { btn.remove(); au.play(); const loop = () => { drawFrame(ctx, au.currentTime); if (!au.ended) requestAnimationFrame(loop); }; loop(); };
  });
}
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>دعاء الخميس — خط النور</title>
<style>
  @font-face { font-family: Ruqaa; src: url(../../thursday-22oct/fonts/ArefRuqaa-Bold.ttf); font-display: block; }
  @font-face { font-family: Kufi; src: url(../../thursday-22oct/fonts/ReemKufi-VF.ttf); font-weight: 400 700; font-display: block; }
  @font-face { font-family: Amiri; src: url(../../thursday-22oct/fonts/Amiri-Bold.ttf); font-display: block; }
  @font-face { font-family: Jumuah; src: url(../../thursday-22oct/fonts/KOSIFJumuah-Bold.ttf); font-display: block; }
  html, body { margin: 0; background: #07110d; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
<script src="words.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
  const W = 1080, H = 1920, FPS = 30, DURATION = 27.074;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const GOLD = '#f2cd78', GOLD_HI = '#fff1c9', CREAM = '#fbf5e8';
  const P = { x: 40, y: 420, w: 1000, h: 926, r: 36 };   // the clear video panel

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lin = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---------- frames
  const cache = new Map();
  function img(src) {
    if (cache.has(src)) return cache.get(src);
    const im = new Image(); im.src = src;
    const p = im.decode().then(() => im, () => null);
    cache.set(src, p);
    if (cache.size > 300) cache.delete(cache.keys().next().value);
    return p;
  }
  const frameSrc = (s, t) => '../build/frames/s' + String(s.i).padStart(2, '0') + '/a_' +
    String(clamp(Math.floor((t - s.from) * FPS + 1e-6) + 1, 1, s.frames)).padStart(4, '0') + '.jpg';

  // ---------- shapes
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function starPath(cx, cy, R, rot) {   // eight-point star (two squares)
    ctx.beginPath();
    for (let k = 0; k < 16; k++) {
      const a = rot + k * Math.PI / 8, rr = k % 2 ? R * .76 : R;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  // ---------- one shot drawn into the panel, with its slow push
  function drawShot(im, s, t, o = {}) {
    if (!im) return;
    const p = lin(t, s.cut, s.next);
    const base = Math.max(P.w / im.width, P.h / im.height);
    // cover the panel + 2% headroom; the drift is clamped so no edge shows (dx/dy are deliberate slides)
    const z = base * (1.02 + .06 * easeInOut(p)) * Math.max(1, o.scale || 1);
    const dir = s.i % 2 ? 1 : -1;
    const w = im.width * z, h = im.height * z;
    const x = clamp(P.x + (P.w - w) / 2 + dir * 14 * (p - .5), P.x + P.w - w, P.x) + (o.dx || 0), y = P.y + (P.h - h) / 2 + (o.dy || 0);
    ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
    ctx.drawImage(im, x, y, w, h);
    ctx.globalAlpha = 1;
  }

  // ---------- transitions: run only inside [cut-0.22, cut+0.32], the rest of the shot stays clean
  const T_IN = .22, T_OUT = .32;
  function transition(kind, prev, next, sp, sn, t, p) {
    const cx = P.x + P.w / 2, cy = P.y + P.h / 2, diag = Math.hypot(P.w, P.h) / 2;
    switch (kind) {
      case 'zoom':
        drawShot(prev, sp, t, { scale: 1 + .35 * p, alpha: 1 - p });
        drawShot(next, sn, t, { scale: 1.18 - .18 * p, alpha: p });
        break;
      case 'star': {
        drawShot(prev, sp, t);
        const R = diag * 1.35 * easeInOut(p), rot = p * Math.PI / 2;
        ctx.save(); starPath(cx, cy, R, rot); ctx.clip(); drawShot(next, sn, t); ctx.restore();
        ctx.save(); starPath(cx, cy, R, rot); ctx.strokeStyle = GOLD; ctx.lineWidth = 6;
        ctx.shadowColor = 'rgba(255,205,110,.9)'; ctx.shadowBlur = 24; ctx.globalAlpha = 1 - p * p; ctx.stroke(); ctx.restore();
        break;
      }
      case 'sweep': {   // a diagonal blade of light uncovers the next shot from the bottom-right
        drawShot(prev, sp, t);
        const k = (P.w + P.h) * 1.05 * easeInOut(p), Rx = P.x + P.w, By = P.y + P.h;
        ctx.save(); ctx.beginPath();
        ctx.moveTo(Rx + 20, By - k - 20); ctx.lineTo(Rx - k - 20, By + 20); ctx.lineTo(Rx + 20, By + 20); ctx.closePath();
        ctx.clip(); drawShot(next, sn, t); ctx.restore();
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.sin(Math.PI * p);
        ctx.strokeStyle = 'rgba(255,225,160,.95)'; ctx.lineWidth = 10; ctx.shadowColor = '#ffd27a'; ctx.shadowBlur = 40;
        ctx.beginPath(); ctx.moveTo(Rx + 20, By - k - 20); ctx.lineTo(Rx - k - 20, By + 20); ctx.stroke(); ctx.restore();
        break;
      }
      case 'push': {
        const q = easeInOut(p);
        drawShot(prev, sp, t, { dy: -P.h * q });
        drawShot(next, sn, t, { dy: P.h * (1 - q) });
        break;
      }
      case 'doors': {   // the outgoing shot opens like a double door
        drawShot(next, sn, t, { scale: 1.08 - .08 * p });
        const q = easeInOut(p), half = P.w / 2;
        [[-1, P.x, P.x + half], [1, P.x + half, P.x + P.w]].forEach(([side, x0, x1]) => {
          ctx.save(); ctx.beginPath(); ctx.rect(x0 + side * half * q, P.y, half, P.h); ctx.clip();
          ctx.translate(side * half * q, 0); drawShot(prev, sp, t); ctx.restore();
        });
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.sin(Math.PI * p) * .9;
        const g = ctx.createLinearGradient(cx - half * q, 0, cx + half * q, 0);
        g.addColorStop(0, 'rgba(255,214,140,0)'); g.addColorStop(.5, 'rgba(255,236,190,.7)'); g.addColorStop(1, 'rgba(255,214,140,0)');
        ctx.fillStyle = g; ctx.fillRect(cx - half * q - 20, P.y, half * q * 2 + 40, P.h); ctx.restore();
        break;
      }
      case 'lightwave': {
        drawShot(prev, sp, t);
        const R = diag * 1.6 * easeInOut(p), oy = P.y + P.h + 60;
        ctx.save(); ctx.beginPath(); ctx.arc(cx, oy, R, 0, 7); ctx.clip(); drawShot(next, sn, t); ctx.restore();
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - p;
        ctx.strokeStyle = 'rgba(255,220,150,.95)'; ctx.lineWidth = 14; ctx.shadowColor = '#ffcf70'; ctx.shadowBlur = 50;
        ctx.beginPath(); ctx.arc(cx, oy, R, 0, 7); ctx.stroke(); ctx.restore();
        break;
      }
      case 'rain': {   // ripples open the next shot
        drawShot(prev, sp, t);
        const drops = RAIN;
        ctx.save(); ctx.beginPath();
        drops.forEach(d => { const q = easeOut(lin(p, d.d, d.d + .55)); if (q > 0) { ctx.moveTo(d.x + q * d.r, d.y); ctx.arc(d.x, d.y, q * d.r, 0, 7); } });
        ctx.clip(); drawShot(next, sn, t); ctx.restore();
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        drops.forEach(d => { const q = easeOut(lin(p, d.d, d.d + .55)); if (q > 0 && q < 1) {
          ctx.globalAlpha = (1 - q) * .9; ctx.strokeStyle = 'rgba(220,240,255,.9)'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(d.x, d.y, q * d.r, 0, 7); ctx.stroke(); } });
        ctx.restore();
        break;
      }
      case 'bloom':
        drawShot(prev, sp, t, { alpha: 1 - p }); drawShot(next, sn, t, { alpha: p, scale: 1.05 - .05 * p });
        ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .45 * Math.sin(Math.PI * p);
        { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, diag);
          g.addColorStop(0, 'rgba(255,236,190,1)'); g.addColorStop(1, 'rgba(255,190,100,0)'); ctx.fillStyle = g; }
        ctx.fillRect(P.x, P.y, P.w, P.h); ctx.restore();
        break;
      default:   // dissolve
        drawShot(prev, sp, t); drawShot(next, sn, t, { alpha: easeInOut(p) });
    }
  }
  const RAIN = Array.from({ length: 9 }, (_, k) => ({
    x: P.x + 120 + rnd() * (P.w - 240), y: P.y + 120 + rnd() * (P.h - 240), r: 520 + rnd() * 380, d: k * .05,
  }));

  async function drawPanel(t) {
    let i = SHOTS.findIndex((s, k) => t < (SHOTS[k + 1] ? SHOTS[k + 1].cut - T_IN : 1e9));
    if (i < 0) i = SHOTS.length - 1;
    const s = SHOTS[i], n = SHOTS[i + 1];
    ctx.save(); roundRect(P.x, P.y, P.w, P.h, P.r); ctx.clip();
    ctx.fillStyle = '#000'; ctx.fillRect(P.x, P.y, P.w, P.h);
    if (n && t >= n.cut - T_IN) {   // inside a transition window
      const [a, b] = await Promise.all([img(frameSrc(s, t)), img(frameSrc(n, t))]);
      transition(n.tr, a, b, s, n, t, lin(t, n.cut - T_IN, n.cut + T_OUT));
    } else if (i > 0 && t < s.cut + T_OUT) {
      const pr = SHOTS[i - 1];
      const [a, b] = await Promise.all([img(frameSrc(pr, t)), img(frameSrc(s, t))]);
      transition(s.tr, a, b, pr, s, t, lin(t, s.cut - T_IN, s.cut + T_OUT));
    } else {
      const a = await img(frameSrc(s, t));
      if (i === 0 && t < 1.0) {   // opening: the first shot blooms out of a star
        const R = Math.hypot(P.w, P.h) * .75 * (.14 + .86 * easeInOut(lin(t, 0, .9)));
        ctx.save(); starPath(P.x + P.w / 2, P.y + P.h / 2, R, t * .8); ctx.clip(); drawShot(a, s, t); ctx.restore();
      } else drawShot(a, s, t);
    }
    ctx.restore();
    [frameSrc(s, t + 1 / FPS), n && frameSrc(n, t + 1 / FPS)].forEach(f => f && img(f));
  }

  // ---------- background (outside the panel only)
  const motes = Array.from({ length: 46 }, () => ({ x: rnd() * W, y: rnd() * H, r: 1 + rnd() * 2.6, v: 14 + rnd() * 30, ph: rnd() * 6.3 }));
  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1a14'); g.addColorStop(.5, '#0f2a20'); g.addColorStop(1, '#07110d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // faint drifting star lattice
    ctx.save(); ctx.strokeStyle = 'rgba(242,205,120,.07)'; ctx.lineWidth = 1.5;
    const step = 135, off = (t * 6) % step;
    for (let y = -step; y < H + step; y += step) for (let x = -step; x < W + step; x += step) {
      starPath(x + off + ((y / step) % 2 ? step / 2 : 0), y + off * .5, 34, 0); ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    motes.forEach(m => {
      const y = ((m.y - m.v * t) % H + H) % H, x = m.x + Math.sin(t * .6 + m.ph) * 16;
      if (y > P.y - 10 && y < P.y + P.h + 10) return;          // never over the footage
      const a = .3 + .5 * Math.abs(Math.sin(t * 1.4 + m.ph));
      const rg = ctx.createRadialGradient(x, y, 0, x, y, m.r * 4);
      rg.addColorStop(0, `rgba(255,226,160,${a})`); rg.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, m.r * 4, 0, 7); ctx.fill();
    });
    ctx.restore();
  }

  function drawFrame(t) {   // gold border drawn on at the start, glows at the end
    const draw = easeInOut(lin(t, .1, 1.3)), glow = .5 + .5 * lin(t, 25.0, 26.4);
    const len = 2 * (P.w + P.h);
    ctx.save(); roundRect(P.x - 8, P.y - 8, P.w + 16, P.h + 16, P.r + 8);
    ctx.setLineDash([len * draw, len + 200]); ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(255,205,110,.9)'; ctx.shadowBlur = 16 + 20 * glow; ctx.stroke(); ctx.restore();
    // corner stars
    const sa = easeOut(lin(t, 1.0, 1.6));
    if (sa > 0) [[P.x - 8, P.y - 8], [P.x + P.w + 8, P.y - 8], [P.x - 8, P.y + P.h + 8], [P.x + P.w + 8, P.y + P.h + 8]].forEach(([x, y], k) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * .3 * (k % 2 ? 1 : -1)); ctx.scale(sa, sa);
      starPath(0, 0, 16, 0); ctx.fillStyle = GOLD; ctx.shadowColor = '#ffd27a'; ctx.shadowBlur = 14; ctx.fill(); ctx.restore();
    });
  }

  function goldFill(y0, y1) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, GOLD_HI); g.addColorStop(.5, GOLD); g.addColorStop(1, '#c08a3a'); return g;
  }

  function drawHeader(t) {
    const p = easeInOut(lin(t, .2, 1.2));
    if (p > 0) {
      ctx.save(); ctx.font = '132px Ruqaa'; ctx.textAlign = 'center'; ctx.direction = 'rtl';
      const w = ctx.measureText('الخميس').width, right = 540 + w / 2 + 30, edge = right - (w + 60) * p;
      ctx.beginPath(); ctx.rect(edge, 120, right - edge + 10, 220); ctx.clip();
      ctx.shadowColor = 'rgba(255,190,90,.8)'; ctx.shadowBlur = 24; ctx.fillStyle = goldFill(180, 300);
      ctx.fillText('الخميس', 540, 290); ctx.restore();
    }
    const a = easeOut(lin(t, .8, 1.4));
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a; ctx.textBaseline = 'middle';
    const y = 365 + 14 * (1 - a);
    ctx.font = '600 48px Kufi'; ctx.direction = 'ltr'; const g = '22.10.2026', gw = ctx.measureText(g).width;
    ctx.font = '500 44px Kufi'; ctx.direction = 'rtl'; const h = '١١ جمادى الأولى ١٤٤٨ هـ', hw = ctx.measureText(h).width;
    const gap = 64, x0 = 540 - (gw + gap + hw) / 2;
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 10;
    ctx.font = '600 48px Kufi'; ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.fillStyle = GOLD; ctx.fillText(g, x0, y);
    ctx.save(); ctx.translate(x0 + gw + gap / 2, y); ctx.rotate(Math.PI / 4); ctx.fillRect(-7, -7, 14, 14); ctx.restore();
    ctx.font = '500 44px Kufi'; ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.fillStyle = CREAM; ctx.fillText(h, x0 + gw + gap + hw, y + 2);
    ctx.restore();
  }

  function drawHandle(t) {
    const a = easeOut(lin(t, 1.4, 2.2));
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a; ctx.font = '600 32px Kufi'; ctx.direction = 'ltr'; ctx.textAlign = 'center';
    ctx.textBaseline = 'middle'; if ('letterSpacing' in ctx) ctx.letterSpacing = '5px';
    ctx.fillStyle = CREAM; ctx.fillText('@kosif', 540, P.y + P.h + 52);
    ctx.fillStyle = GOLD; ctx.fillRect(540 - 50 * a, P.y + P.h + 76, 100 * a, 2); ctx.restore();
  }

  // ---------- the verse: written right to left, the pen follows the recitation
  function drawVerse(t, ph) {
    const fade = 1 - easeInOut(lin(t, 3.05, 3.5));
    if (fade <= 0) return;
    ctx.save(); ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.font = '78px Amiri';
    const open = '﴿', close = '﴾', sp = ctx.measureText(' ').width;
    const parts = [open, ...ph.words.map(w => w.w), close];
    const widths = parts.map(s => ctx.measureText(s).width);
    const total = widths.reduce((a, b) => a + b, 0) + sp * (parts.length - 1);
    let x = 540 + total / 2; const y = 1560;
    const stops = [{ x, t: -.2 }];
    const pos = parts.map((s, k) => { const r = x; x -= widths[k] + sp; return r; });
    ph.words.forEach((w, k) => stops.push({ x: pos[k + 1] - widths[k + 1], t: w.e - .05 }));
    stops.push({ x: pos[parts.length - 1] - widths[parts.length - 1] - 10, t: ph.e + .2 });
    let edge = stops[stops.length - 1].x;
    for (let k = 1; k < stops.length; k++) if (t < stops[k].t) {
      const q = easeInOut(lin(t, stops[k - 1].t, stops[k].t)); edge = stops[k - 1].x + (stops[k].x - stops[k - 1].x) * q; break;
    }
    ctx.globalAlpha = fade;
    ctx.save(); ctx.beginPath(); ctx.rect(edge - 6, y - 110, 540 + total / 2 - edge + 40, 220); ctx.clip();
    ctx.shadowColor = 'rgba(255,190,90,.7)'; ctx.shadowBlur = 22;
    parts.forEach((s, k) => { ctx.fillStyle = k === 0 || k === parts.length - 1 ? GOLD : goldFill(y - 60, y + 50); ctx.fillText(s, pos[k], y); });
    ctx.restore();
    if (t < ph.e + .2) {   // the nib of light
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(edge, y, 0, edge, y, 60);
      g.addColorStop(0, 'rgba(255,240,200,.9)'); g.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = g; ctx.fillRect(edge - 60, y - 60, 120, 120); ctx.restore();
    }
    ctx.globalAlpha = fade * easeOut(lin(t, 1.6, 2.4)) * .9;
    ctx.font = '500 30px Kufi'; ctx.textAlign = 'center'; ctx.fillStyle = CREAM;
    ctx.fillText('سورة الضحى · ٥', 540, y + 92);
    ctx.restore();
  }

  // ---------- the dua, word by word with key words in Ruqaa
  const KEY = new Set(['ربِّ', 'الواقعة', 'الخالقُ', 'والرازق', 'إليك', 'الخير', 'ديونَنا', 'همومَنا', 'واسعًا', 'طيبةً', 'يدوم']);
  const STYLES = ['rise', 'pop', 'slide', 'rise', 'pop', 'slide', 'rise', 'pop', 'slide', 'rise'];
  const Y_TEXT = 1565, LINE_H = 112, MAXW = 900;
  const fontOf = w => KEY.has(w) ? '104px Ruqaa' : '84px Amiri';
  function layout(ph) {
    ctx.font = '84px Amiri'; const space = ctx.measureText(' ').width * 1.2;
    const lines = [[]];
    ph.words.forEach(w => {
      ctx.font = fontOf(w.w); const ww = ctx.measureText(w.w).width;
      let ln = lines[lines.length - 1];
      const cur = ln.reduce((s, x) => s + x.ww + space, 0);
      if (ln.length && cur + ww > MAXW) { lines.push([]); ln = lines[lines.length - 1]; }
      ln.push({ ...w, ww });
    });
    const out = [];
    lines.forEach((ln, li) => {
      const lw = ln.reduce((s, x) => s + x.ww, 0) + space * (ln.length - 1);
      let x = 540 + lw / 2;
      ln.forEach(w => { out.push({ ...w, cx: x - w.ww / 2, line: li }); x -= w.ww + space; });
    });
    return { words: out, n: lines.length };
  }
  function drawPhrase(ph, idx, t) {
    const L = layout(ph), next = WORDS[idx + 1], style = STYLES[(idx - 1) % STYLES.length];
    const out = next ? easeInOut(lin(t, next.s - .22, next.s + .04)) : 0;
    const y0 = Y_TEXT - (L.n - 1) * LINE_H / 2;
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
    L.words.forEach(w => {
      const q = lin(t, w.s - .16, w.s + .2); if (q <= 0) return;
      const e = easeOut(q), key = KEY.has(w.w), active = t >= w.s - .03 && t < w.e - .02;
      let dx = 0, dy = 0, sc = 1;
      if (style === 'rise') dy = 34 * (1 - e);
      if (style === 'pop') sc = .6 + .4 * easeBack(q);
      if (style === 'slide') dx = 60 * (1 - e);
      const y = y0 + w.line * LINE_H - 30 * out;
      ctx.save(); ctx.globalAlpha = e * (1 - out); ctx.translate(w.cx + dx, y + dy); ctx.scale(sc, sc);
      ctx.font = fontOf(w.w);
      ctx.shadowColor = active ? 'rgba(255,190,90,.95)' : 'rgba(0,0,0,.7)'; ctx.shadowBlur = active ? 30 : 12;
      ctx.fillStyle = key ? goldFill(-60, 50) : (active ? GOLD_HI : CREAM);
      ctx.fillText(w.w, 0, key ? -6 : 0);
      if (active) {   // a short gold kashida glides under the spoken word
        const k = easeOut(lin(t, w.s - .05, w.s + .25));
        ctx.shadowBlur = 16; ctx.fillStyle = GOLD; ctx.fillRect(w.ww / 2 - w.ww * k, 54, w.ww * k, 4);
      }
      ctx.restore();
    });
    ctx.restore();
  }
  function drawText(t) {
    WORDS.forEach((ph, i) => {
      if (ph.verse) return drawVerse(t, ph);
      const next = WORDS[i + 1];
      if (t >= ph.s - .2 && (!next || t < next.s + .06)) drawPhrase(ph, i, t);
    });
  }

  async function seek(t) {
    t = clamp(t, 0, DURATION);
    drawBackground(t);
    await drawPanel(t);
    drawFrame(t);
    drawHeader(t);
    drawHandle(t);
    drawText(t);
  }

  window.__kosif = { duration: DURATION, fps: FPS, seek };
  window.__kosifReady = Promise.all(['132px Ruqaa', '600 48px Kufi', '84px Amiri', '104px Jumuah']
    .map(f => document.fonts.load(f, 'الخميس ﴿يُعْطِيكَ﴾ 2026'))).then(() => document.fonts.ready).then(() => true);
  const t0 = parseFloat(new URLSearchParams(location.search).get('t') || '0') || 0;
  window.__kosifReady.then(() => seek(t0));
})();
</script>

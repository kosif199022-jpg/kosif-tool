<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>مطر الرحمة</title>
<style>
  @font-face { font-family: Amiri; src: url(../../thursday-22oct/fonts/Amiri-Bold.ttf); font-display: block; }
  @font-face { font-family: AmiriR; src: url(../../thursday-22oct/fonts/Amiri-Regular.ttf); font-display: block; }
  @font-face { font-family: Kufi; src: url(../../thursday-22oct/fonts/ReemKufi-VF.ttf); font-weight: 400 700; font-display: block; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
<script src="data.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
  const W = 1080, H = 1920, FPS = 30, DURATION = 47.02;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const GOLD = '#ffe2a3', GOLD_HI = '#fff4d6', WHITE = '#ffffff';

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lin = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // piecewise-linear keyframes
  const curve = (keys, t) => { for (let i = 1; i < keys.length; i++) if (t <= keys[i][0])
    return keys[i - 1][1] + (keys[i][1] - keys[i - 1][1]) * easeInOut(lin(t, keys[i - 1][0], keys[i][0])); return keys[keys.length - 1][1]; };

  // rain follows the dua: light → heavy at «يا ملاذي عند كربتي» → calm at «بردًا وسلامًا» → gone at «ودبّر لي أمري»
  const RAIN = [[0, .22], [6, .28], [14, .32], [17.06, .55], [19.2, .85], [21.2, .95], [23.0, .9], [24.0, .32], [27.8, .3],
                [29.5, .48], [36.5, .5], [39.98, .32], [42.6, .08], [43.4, 0], [47.1, 0]];

  // ---------------- frames
  const cache = new Map();
  function img(src) {
    if (cache.has(src)) return cache.get(src);
    const im = new Image(); im.src = src;
    const p = im.decode().then(() => im, () => null);
    cache.set(src, p); if (cache.size > 260) cache.delete(cache.keys().next().value);
    return p;
  }
  const pad4 = n => String(n).padStart(4, '0');
  const shotSrc = (s, t) => '../build/frames/s' + String(s.i).padStart(2, '0') + '/a_' + pad4(clamp(Math.floor((t - s.from) * FPS + 1e-6) + 1, 1, s.frames)) + '.jpg';
  const rainSrc = (t, off = 0) => '../build/frames/rain/r_' + pad4((Math.floor(t * FPS) + off) % RAIN_FRAMES + 1) + '.jpg';

  function drawShot(im, s, t, alpha = 1) {
    if (!im) return;
    // cover + 2% headroom for the drift, and the drift clamped so no edge of the shot ever shows
    const p = lin(t, s.cut, s.next), z = 1.02 + .05 * easeInOut(p);
    const base = Math.max(W / im.width, H / im.height) * z;
    const w = im.width * base, h = im.height * base, dir = s.i % 2 ? 1 : -1;
    const x = clamp((W - w) / 2 + dir * 16 * (p - .5), W - w, 0), y = clamp((H - h) / 2 - 10 * p, H - h, 0);
    ctx.globalAlpha = alpha;
    ctx.drawImage(im, x, y, w, h);
    ctx.globalAlpha = 1;
  }

  // drops landing on glass open the next shot (used twice: into the night, and as the rain clears)
  const DROPS = Array.from({ length: 14 }, (_, k) => ({ x: 80 + rnd() * 920, y: 180 + rnd() * 1560, r: 380 + rnd() * 520, d: rnd() * .45 }));
  function glass(prev, next, sp, sn, t, p) {
    drawShot(prev, sp, t);
    ctx.save(); ctx.beginPath();
    DROPS.forEach(d => { const q = easeOut(lin(p, d.d, d.d + .55)); if (q > 0) { ctx.moveTo(d.x + q * d.r, d.y); ctx.arc(d.x, d.y, q * d.r, 0, 7); } });
    ctx.clip(); drawShot(next, sn, t); ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    DROPS.forEach(d => { const q = easeOut(lin(p, d.d, d.d + .55)); if (q > 0 && q < 1) {
      ctx.globalAlpha = (1 - q) * .7; ctx.lineWidth = 3 + 6 * (1 - q); ctx.strokeStyle = 'rgba(220,235,255,.9)';
      ctx.beginPath(); ctx.arc(d.x, d.y, q * d.r, 0, 7); ctx.stroke(); } });
    ctx.restore();
  }

  async function drawFootage(t) {
    let i = SHOTS.findIndex((s, k) => !SHOTS[k + 1] || t < SHOTS[k + 1].cut - .35);
    const s = SHOTS[i], n = SHOTS[i + 1], pr = SHOTS[i - 1];
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const into = (a, b) => b.tr === 'glass' ? [.45, .75] : [.35, .35];
    if (n && t >= n.cut - into(s, n)[0]) {
      const [a, b] = await Promise.all([img(shotSrc(s, t)), img(shotSrc(n, t))]);
      const [pre, post] = into(s, n), p = lin(t, n.cut - pre, n.cut + post);
      if (n.tr === 'glass') glass(a, b, s, n, t, p); else { drawShot(a, s, t); drawShot(b, n, t, easeInOut(p)); }
    } else if (pr && t < s.cut + into(pr, s)[1]) {
      const [a, b] = await Promise.all([img(shotSrc(pr, t)), img(shotSrc(s, t))]);
      const [pre, post] = into(pr, s), p = lin(t, s.cut - pre, s.cut + post);
      if (s.tr === 'glass') glass(a, b, pr, s, t, p); else { drawShot(a, pr, t); drawShot(b, s, t, easeInOut(p)); }
    } else drawShot(await img(shotSrc(s, t)), s, t);
    [shotSrc(s, t + 1 / FPS), n && shotSrc(n, t + 1 / FPS)].forEach(f => f && img(f));
  }

  async function drawRain(t) {
    const k = curve(RAIN, t); if (k <= .01) return;
    const [r1, r2] = await Promise.all([img(rainSrc(t)), img(rainSrc(t, 211))]);
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    if (r1) { ctx.globalAlpha = k * .85; ctx.drawImage(r1, 0, 0, W, H); }
    if (r2) { ctx.globalAlpha = k * .45; ctx.drawImage(r2, -W * .25, -H * .25, W * 1.5, H * 1.5); }   // nearer, bigger drops
    ctx.restore();
    img(rainSrc(t + 1 / FPS)); img(rainSrc(t + 1 / FPS, 211));
  }

  function drawLight(t) {   // «ودبّر لي أمري»: the rain stops and light comes from above
    const k = lin(t, 43.2, 44.6) * (1 - lin(t, 45.8, 46.6)); if (k <= 0) return;
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .55 * k;
    const g = ctx.createRadialGradient(760, -120, 40, 760, -120, 1500);
    g.addColorStop(0, 'rgba(255,236,190,1)'); g.addColorStop(.4, 'rgba(255,210,140,.35)'); g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let r = 0; r < 5; r++) {
      const a = -1.95 + r * .16 + Math.sin(t * .4 + r) * .02;
      ctx.globalAlpha = .12 * k; ctx.beginPath(); ctx.moveTo(760, -120);
      ctx.lineTo(760 + Math.cos(a - .03) * 2600, -120 - Math.sin(a - .03) * 2600 * -1);
      ctx.lineTo(760 + Math.cos(a + .03) * 2600, -120 - Math.sin(a + .03) * 2600 * -1); ctx.closePath();
      ctx.fillStyle = '#fff1cc'; ctx.fill();
    }
    ctx.restore();
  }

  // ---------------- type
  function header(t) {
    const a = easeOut(lin(t, .6, 1.6)) * (1 - lin(t, 45.4, 46.2)); if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a * .9; ctx.textAlign = 'center'; ctx.direction = 'rtl'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 22; ctx.fillStyle = WHITE;
    ctx.font = '500 36px Kufi'; ctx.fillText('الجمعة ٢٣ أكتوبر ٢٠٢٦  ·  ١٢ جمادى الأولى ١٤٤٨ هـ', 540, 250);
    ctx.globalAlpha = a * .7; ctx.font = '500 26px Kufi'; ctx.fillText('@kosif  ·  الصوت: @ali1.697', 540, 300);
    ctx.restore();
  }

  const MAXW = 900, LH = 104;
  function layout(ph, font) {
    ctx.font = font; const sp = ctx.measureText(' ').width * 1.1, lines = [[]];
    ph.words.forEach(w => { const ww = ctx.measureText(w.w).width; let ln = lines[lines.length - 1];
      const cur = ln.reduce((s, x) => s + x.ww + sp, 0); if (ln.length && cur + ww > MAXW) { lines.push([]); ln = lines[lines.length - 1]; }
      ln.push({ ...w, ww }); });
    const out = []; lines.forEach((ln, li) => { const lw = ln.reduce((s, x) => s + x.ww, 0) + sp * (ln.length - 1); let x = 540 + lw / 2;
      ln.forEach(w => { out.push({ ...w, cx: x - w.ww / 2, x0: x - w.ww, x1: x, line: li }); x -= w.ww + sp; }); });
    return { words: out, n: lines.length, sp };
  }

  function dua(ph, i, t) {
    const next = WORDS[i + 1];
    const out = next ? easeInOut(lin(t, next.s - .3, next.s)) : lin(t, 45.6, 46.4);
    const font = ph.verse ? '74px Amiri' : '68px Amiri';
    const L = layout(ph, font), y0 = 960 - (L.n - 1) * LH / 2;
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
    L.words.forEach(w => {
      const q = lin(t, w.s - .18, w.s + .22); if (q <= 0) return;
      const e = easeOut(q), y = y0 + w.line * LH - 10 * out + 14 * (1 - e);
      const active = t >= w.s - .03 && t < w.e;
      // a drop lands: a faint ring opens behind the word as it appears
      const rq = lin(t, w.s - .1, w.s + .6);
      if (rq > 0 && rq < 1) { ctx.save(); ctx.globalAlpha = (1 - rq) * .45 * (1 - out); ctx.strokeStyle = ph.verse ? GOLD : '#dfeaff';
        ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(w.cx, y + 6, 20 + rq * w.ww * .6, 6 + rq * 22, 0, 0, 7); ctx.stroke(); ctx.restore(); }
      ctx.globalAlpha = e * (1 - out); ctx.font = font;
      // legibility: a soft dark halo hugging the letters only (no band over the footage)
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.shadowColor = 'rgba(0,0,0,1)';
      ctx.shadowBlur = 44; ctx.fillText(w.w, w.cx, y); ctx.shadowBlur = 24; ctx.fillText(w.w, w.cx, y); ctx.shadowBlur = 10; ctx.fillText(w.w, w.cx, y); ctx.restore();
      ctx.shadowColor = active ? 'rgba(255,214,140,.95)' : 'rgba(0,0,0,.85)'; ctx.shadowBlur = active ? 28 : 16;
      ctx.fillStyle = ph.verse ? (active ? GOLD_HI : GOLD) : (active ? GOLD_HI : WHITE);
      ctx.fillText(w.w, w.cx, y);
      if (!active) { ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.fillText(w.w, w.cx, y); }
    });
    // Qur'anic brackets and the citation
    if (ph.verse) {
      const first = L.words[0], last = L.words[L.words.length - 1];
      ctx.globalAlpha = (1 - out) * easeOut(lin(t, ph.s - .2, ph.s + .3)); ctx.font = '74px Amiri'; ctx.fillStyle = GOLD;
      ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 12;
      if (ph.verse === 'open') ctx.fillText('﴿', Math.min(1040, first.x1 + 34), y0);
      if (ph.verse === 'close' && t > last.s) ctx.fillText('﴾', Math.max(40, last.x0 - 34), y0 + (L.n - 1) * LH);
      ctx.font = '500 28px Kufi'; ctx.fillStyle = WHITE; ctx.globalAlpha *= .8;
      ctx.fillText('سورة الأحقاف · ١٥', 540, y0 + (L.n - 1) * LH + 92);
    }
    ctx.restore();
  }
  function text(t) {
    WORDS.forEach((ph, i) => { const next = WORDS[i + 1];
      if (t >= ph.s - .25 && (!next || t < next.s + .05)) dua(ph, i, t); });
  }

  async function seek(t) {
    t = clamp(t, 0, DURATION);
    await drawFootage(t);
    await drawRain(t);
    drawLight(t);
    // a light vignette only at the very edges
    const v = ctx.createRadialGradient(540, 960, 700, 540, 960, 1250);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.35)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    header(t);
    text(t);
    // open from black, close to black like the reference
    const blk = Math.max(1 - lin(t, 0, .8), lin(t, 45.9, 46.9));
    if (blk > 0) { ctx.fillStyle = `rgba(0,0,0,${blk})`; ctx.fillRect(0, 0, W, H); }
  }
  window.__kosif = { duration: DURATION, fps: FPS, seek };
  window.__kosifReady = Promise.all(['74px Amiri', '68px AmiriR', '500 36px Kufi'].map(f => document.fonts.load(f, 'اللَّهُمَّ ﴿رَبِّ﴾ ٢٣')))
    .then(() => document.fonts.ready).then(() => true);
  const t0 = parseFloat(new URLSearchParams(location.search).get('t') || '0') || 0;
  window.__kosifReady.then(() => seek(t0));
})();
</script>
</body>
</html>

<style>

  /* ---------- lyric captions ---------- */
  #caps { position: absolute; left: 70px; right: 70px; bottom: 300px; height: 330px; z-index: 4; }
  .line { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center;
    align-items: baseline; gap: 4px 22px; text-align: center; opacity: 0; will-change: transform, opacity, clip-path; }
  .line .w { display: inline-block; white-space: nowrap; will-change: transform, color; }
  .v { font: 800 70px/1.45 "Cairo", sans-serif; color: rgba(255,255,255,.62);

  .ch { font: 700 96px/1.4 "Aref Ruqaa", serif; color: rgba(255,255,255,.58);

  .am { font: 700 82px/1.5 "Amiri", serif; color: rgba(255,255,255,.62);
    text-shadow: 0 5px 22px rgba(0,0,0,.7); }
  .tag { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 18px; text-align: center;
    font: 600 30px "Reem Kufi", sans-serif; color: var(--gold); letter-spacing: 0; opacity: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,.7); }

  /* ---------- overlays ---------- */
  .ov { position: absolute; inset: 0; pointer-events: none; z-index: 5; opacity: 0; }
  #title { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 330px; }
  #title .t1 { font: 700 150px/1.25 "Aref Ruqaa", serif; color: transparent; padding: 0 40px;
    background: linear-gradient(100deg, #b8862b 0%, #ffe9a8 22%, #f2c14e 40%, #fff6d6 50%, #d99a2b 62%, #ffe08a 80%, #a8741f 100%);
    background-size: 260% 100%; -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 8px 26px rgba(0,0,0,.65)); }
  #title .t2 { font: 700 46px "Cairo", sans-serif; color: #fff; margin-top: 6px; display: flex; gap: 26px; align-items: center;
    text-shadow: 0 3px 14px rgba(0,0,0,.8); }
  #title .chip { width: 64px; height: 40px; border-radius: 6px; overflow: hidden; display: inline-flex; flex-direction: column; box-shadow: 0 3px 12px rgba(0,0,0,.6); }
  #title svg { width: 760px; height: 60px; margin-top: 8px; overflow: visible; }
  #map svg, #icons svg, #wave svg, #endcard svg { overflow: visible; }
  #map { background: radial-gradient(ellipse at 50% 45%, rgba(4,16,30,.62), rgba(0,0,0,.9)); }
  #map .head { position: absolute; left: 0; right: 0; top: 330px; text-align: center;
    font: 700 108px/1.3 "Aref Ruqaa", serif; color: var(--gold); text-shadow: 0 6px 28px rgba(0,0,0,.8); }
  #map .city { font: 800 54px "Cairo", sans-serif; fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 8px; }
  #map .sea { font: 600 36px "Reem Kufi", sans-serif; fill: #9fd8ff; }
  #icons { z-index: 5; }
  #icons svg { position: absolute; left: 50%; top: 1060px; width: 210px; height: 175px; margin-left: -105px; opacity: 0;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.7)); }
  #wave svg { position: absolute; left: 0; top: 1610px; width: 1080px; height: 80px; }
  #endcard { background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.55), rgba(0,0,0,.82)); display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 120px; }
  #endcard .e1, #endcard .e2 { font: 700 132px/1.35 "Aref Ruqaa", serif; color: transparent;
    background: linear-gradient(100deg, #e9b54a 0%, #ffefb8 25%, #f7cd5e 45%, #fffbe8 52%, #f0b443 65%, #ffe59a 85%, #e3a83c 100%);
    background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 8px 26px rgba(0,0,0,.7)); }
  #endcard .rib { display: flex; gap: 0; margin: 26px 0 18px; }
  #endcard .rib div { height: 12px; }
  #endcard .e3 { font: 600 40px "Reem Kufi", sans-serif; color: rgba(255,255,255,.85); margin-top: 20px; }
  #black { position: absolute; inset: 0; background: #000; z-index: 9; opacity: 0; pointer-events: none; }
  #flash { position: absolute; inset: 0; z-index: 7; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse at 30% 25%, #fff7e0, #ffd98a 55%, #ffb347); mix-blend-mode: screen; }
  #controls { position: fixed; left: 10px; top: 10px; z-index: 20; direction: ltr; font: 14px system-ui; color: #fff; display: flex; gap: 8px; align-items: center; }
  #controls input { width: 600px; }

    <svg id="ic-wheat" viewBox="0 0 120 100"><g fill="none" stroke="#ffd36b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">

      <path clip-path="url(#hr)" fill="#006c35" d="M60 94 C22 66 6 46 16 27 C27 7 50 10 60 29 C70 10 93 7 104 27 C114 46 98 66 60 94 Z"/></g>
      <path pathLength="1" fill="none" stroke="#ffd36b" stroke-width="4.5" stroke-linejoin="round" d="M60 94 C22 66 6 46 16 27 C27 7 50 10 60 29 C70 10 93 7 104 27 C114 46 98 66 60 94 Z"/></svg>

    d="M1040 40 q-30 -26 -60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0"/></svg></div>

<script src="lines.js"></script>
<script src="env.js"></script>
<script>
(function () {
  'use strict';
  const W = 1080, H = 1920, IW = 941, IH = 1672, FPS = 30, DUR = 196.82, FLAG_H = 620;
  const LINES = window.KOSIF_LINES, ENV = window.KOSIF_ENV;
  const $ = (s) => document.querySelector(s);
  const cv = $('#cv'), ctx = cv.getContext('2d');

  /* ---------- math ---------- */
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const E = {
    linear: (x) => x,
    inOutSine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
    inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
    outCubic: (x) => 1 - Math.pow(1 - x, 3),
    outQuart: (x) => 1 - Math.pow(1 - x, 4),
    outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
    outBack: (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2),
  };
  const prog = (t, a, b, e = E.outCubic) => e(clamp01((t - a) / Math.max(1e-6, b - a)));
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let x = s; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  const envAt = (arr, t) => arr[Math.max(0, Math.min(arr.length - 1, Math.round(t * ENV.fps)))] || 0;

  /* ---------- timing helpers (from aligned words) ---------- */
  const LS = (i) => LINES[i].start;
  const WS = (i, j) => LINES[i].words[j].start;
  const cut = (i, j = 0) => WS(i, j) - 0.06;
  const wordIdx = (i, txt) => LINES[i].words.findIndex((w) => w.word.includes(txt));

  /* ---------- framings (image px, zoom) ---------- */
  const F = {
    wide: [470, 836, 1.08], two: [470, 780, 1.38], egF: [292, 690, 2.3], saF: [688, 655, 2.3],
    egS: [205, 672, 2.1], saS: [560, 690, 2.0], eagle: [262, 335, 3.0], shah: [735, 300, 2.5], top: [470, 560, 1.5], low: [470, 1250, 1.6],
  };

  /* ---------- shot list: every lyric line gets its own camera move ---------- */
  const SH = [
    { t: 0,          a: [470, 520, 1.55], b: [470, 700, 1.42], ease: 'inOutSine', foc: [0, 3, 0, 1], grade: 'dawn', tin: 'black' },
    { t: 6.2,        a: [300, 500, 1.75], b: [640, 500, 1.75], ease: 'inOutSine', grade: 'dawn', tin: 'dissolve' },
    { t: 13.2,       a: [470, 836, 1.1],  b: [470, 770, 1.38], ease: 'inOutSine', grade: 'warm', tin: 'dissolve' },
    // verse 1 — proud
    { t: cut(1),     a: F.low, b: [470, 800, 1.32], ease: 'inOutCubic', grade: 'warm', tin: 'flash' },
    { t: cut(2),     a: [200, 690, 1.85], b: [210, 672, 2.25], foc: [3, 0, 4, 0], tin: 'cut' },
    { t: cut(3),     a: [690, 700, 1.95], b: [688, 652, 2.35], foc: [4, 0, 5, 0], tin: 'whip', dir: -1 },
    { t: cut(4),     a: [480, 700, 1.8],  b: [470, 800, 1.22], tin: 'cut' },
    // chorus 1
    { t: cut(5),     a: [275, 560, 1.55], b: [265, 500, 1.8], tin: 'flash', grade: 'gold', kick: 1 },
    { t: cut(5, 1),  a: [292, 700, 2.0],  b: [292, 688, 2.3], foc: [4, 0, 4, 0], tin: 'cut', grade: 'gold', kick: 1 },
    { t: cut(6),     a: [585, 700, 1.85], b: [560, 685, 2.1], foc: [3, 0, 3, 0], tin: 'whip', dir: 1, grade: 'gold', kick: 1 },
    { t: cut(6, 3),  a: [688, 670, 2.1],  b: [688, 650, 2.45], foc: [4, 0, 5, 0], tin: 'cut', grade: 'gold', kick: 1 },
    { t: cut(7),     a: [620, 680, 1.9],  b: [350, 680, 1.9], rot: [-1.5, 1.5], tin: 'whip', dir: -1, grade: 'gold', kick: 1 },
    { t: cut(7, 3),  a: [262, 345, 2.6],  b: [262, 335, 3.1], foc: [0, 6, 0, 6], tin: 'flash', grade: 'gold', kick: 1 },
    { t: cut(8),     a: F.top, b: [470, 836, 1.1], ease: 'inOutCubic', tin: 'cut', grade: 'gold', kick: 1, wave: 1 },
    // verse 2 — warm
    { t: cut(9),     a: [300, 760, 1.6],  b: [290, 700, 2.0], foc: [2, 0, 4, 0], tin: 'dip', grade: 'warm2' },
    { t: cut(10),    glide: 1, b: [735, 470, 1.9], foc: [4, 0, 0, 3], ease: 'inOutCubic', grade: 'warm2' },
    { t: cut(11),    a: [690, 710, 1.75], b: [688, 660, 2.1], foc: [3, 0, 5, 0], tin: 'cut', grade: 'warm2' },
    { t: cut(12),    a: [600, 760, 1.6],  b: [400, 760, 1.6], rot: [1, -1], tin: 'dissolve', grade: 'warm2' },
    // chorus 2
    { t: cut(13),    a: [735, 470, 1.8],  b: [735, 430, 2.15], tin: 'flash', grade: 'gold', kick: 1 },
    { t: cut(13, 1), a: [292, 700, 2.0],  b: [292, 688, 2.3], foc: [4, 0, 4, 0], tin: 'cut', grade: 'gold', kick: 1 },
    { t: cut(14),    a: [200, 690, 1.9],  b: [210, 672, 2.2], foc: [3, 0, 4, 0], tin: 'whip', dir: 1, grade: 'gold', kick: 1 },
    { t: cut(14, 3), a: [560, 700, 1.9],  b: [560, 685, 2.15], foc: [3, 0, 3, 0], tin: 'cut', grade: 'gold', kick: 1 },
    { t: cut(15),    a: [470, 1200, 1.6], b: [470, 760, 1.4], ease: 'inOutCubic', tin: 'whip', dir: -1, grade: 'gold', kick: 1 },
    { t: cut(15, 3), a: [262, 345, 2.6],  b: [262, 335, 3.1], foc: [0, 6, 0, 6], tin: 'flash', grade: 'gold', kick: 1 },
    { t: cut(16),    a: F.top, b: [470, 836, 1.1], ease: 'inOutCubic', tin: 'cut', grade: 'gold', kick: 1, wave: 1 },
    // instrumental — the map: the sea between Cairo and Riyadh
    { t: 94.5,       a: [470, 836, 1.12], b: [470, 800, 1.25], foc: [7, 7, 9, 9], grade: 'night', tin: 'dissolve', ease: 'linear' },
    { t: 100.9,      a: [262, 470, 1.8],  b: [700, 470, 1.8], ease: 'inOutSine', grade: 'night', tin: 'dissolve', shake: 0.25 },
    // verse 3 — drums, intensity
    { t: cut(17),    a: [720, 480, 1.8],  b: [720, 440, 2.25], tin: 'flash', grade: 'storm', shake: 0.7, kick: 1 },
    { t: cut(18),    a: [688, 660, 2.25], b: [688, 650, 2.6], foc: [5, 0, 6, 0], tin: 'cut', grade: 'storm', shake: 0.6, kick: 1 },
    { t: cut(19),    a: [292, 700, 2.0],  b: [292, 690, 2.45], foc: [4, 0, 5, 0], tin: 'whip', dir: -1, grade: 'storm', shake: 0.6, kick: 1 },
    { t: cut(20),    a: [205, 680, 2.0],  b: [440, 760, 1.5], ease: 'inOutCubic', tin: 'cut', grade: 'storm', shake: 0.5, kick: 1 },
    // verse 4 — steady, firm
    { t: cut(21),    a: [470, 780, 1.38], b: [470, 745, 1.58], tin: 'flash', grade: 'warm', ease: 'linear' },
    { t: cut(22),    a: [735, 430, 2.0],  b: [730, 400, 2.35], foc: [0, 4, 0, 4], tin: 'cut', grade: 'warm', ease: 'linear' },
    { t: cut(23),    a: [270, 520, 1.7],  b: [300, 560, 1.95], tin: 'cut', grade: 'warm', ease: 'linear' },
    { t: cut(24),    a: F.low, b: [470, 820, 1.25], ease: 'inOutCubic', tin: 'cut', grade: 'warm' },
    // bridge — oud, emotional
    { t: cut(25),    a: [270, 560, 1.6],  b: [700, 560, 1.6], ease: 'inOutSine', grade: 'soft', tin: 'dip', bars: 1 },
    { t: cut(27),    a: [480, 720, 1.5],  b: [480, 690, 1.95], foc: [2, 0, 6, 0], ease: 'inOutSine', grade: 'soft', tin: 'dissolve', bars: 1 },
    // final chorus — key change, full energy
    { t: cut(29),    a: [262, 400, 2.3],  b: [262, 350, 2.8], tin: 'flash', grade: 'gold2', kick: 1, confetti: 1 },
    { t: cut(29, 1), a: [292, 700, 2.0],  b: [292, 686, 2.35], foc: [4, 0, 4, 0], tin: 'cut', grade: 'gold2', kick: 1, confetti: 1 },
    { t: cut(30),    a: [585, 700, 1.85], b: [560, 685, 2.15], foc: [3, 0, 3, 0], tin: 'whip', dir: 1, grade: 'gold2', kick: 1, confetti: 1 },
    { t: cut(30, 3), a: [688, 670, 2.1],  b: [688, 650, 2.5], foc: [4, 0, 5, 0], tin: 'cut', grade: 'gold2', kick: 1, confetti: 1 },
    { t: cut(31),    a: [620, 680, 1.9],  b: [350, 680, 1.9], rot: [1.5, -1.5], tin: 'whip', dir: -1, grade: 'gold2', kick: 1, confetti: 1 },
    { t: cut(31, 3), a: [735, 330, 2.3],  b: [735, 300, 2.7], foc: [0, 5, 0, 5], tin: 'flash', grade: 'gold2', kick: 1, confetti: 1 },

      seaTxt.style.opacity = prog(t, m0 + 1.6, m0 + 2.2).toFixed(3);
      const pc = prog(t, m0 + 1.6, m0 + 2.1, E.outBack), pr = prog(t, m0 + 2.0, m0 + 2.5, E.outBack);
      cairo.setAttribute('transform', `translate(256 713) scale(${pc.toFixed(3)})`); riyadh.setAttribute('transform', `translate(821 906) scale(${pr.toFixed(3)})`);
      [cairo, riyadh].forEach((g, k) => { const ring = g.querySelector('.ring'), ph = ((t - m0 + k * 0.6) % 1.6) / 1.6; ring.setAttribute('r', (20 + ph * 50).toFixed(1)); ring.style.opacity = (1 - ph).toFixed(3); });
      const pa = prog(t, m0 + 2.6, m0 + 4.4, E.inOutCubic);
      arc.style.strokeDashoffset = (1 - pa).toFixed(3);
      const sp = pa < 1 ? pa : ((t - (m0 + 4.4)) % 2.2) / 2.2;
      const pt = arc.getPointAtLength(E.inOutSine(sp) * arcLen); spark.setAttribute('cx', pt.x.toFixed(1)); spark.setAttribute('cy', pt.y.toFixed(1));
      spark.style.opacity = prog(t, m0 + 2.6, m0 + 2.8).toFixed(3);
      const ph = prog(t, m0 + 4.2, m0 + 5.4, E.outQuart);
      mapHead.style.opacity = ph.toFixed(3); mapHead.style.clipPath = `inset(-30px 0 -30px ${((1 - ph) * 100).toFixed(1)}%)`;
    }
    // icons drawn on key words
    for (const ic of ICONS) {
      const vis = t > ic.t - 0.05 && t < ic.end + 0.5;
      ic.el.style.opacity = vis ? Math.min(prog(t, ic.t, ic.t + 0.25), 1 - prog(t, ic.end, ic.end + 0.4)).toFixed(3) : '0';
      if (!vis) continue;
      ic.paths.forEach((p, k) => { p.style.strokeDashoffset = (1 - prog(t, ic.t + k * 0.12, ic.t + 0.7 + k * 0.12, E.inOutCubic)).toFixed(3); });
      const sc = 0.85 + 0.15 * prog(t, ic.t, ic.t + 0.5, E.outBack);
      ic.el.style.transform = `translateY(${(Math.sin((t - ic.t) * 2.2) * 6).toFixed(1)}px) scale(${sc.toFixed(3)})`;
      if (ic.fill) ic.fill.setAttribute('opacity', prog(t, ic.t + 0.8, ic.t + 1.3).toFixed(3));
    }
    // sea wave under "ما فرّق البحر بيننا"
    let wo = 0;
    for (const w of WAVES) if (t > w.t && t < w.end + 0.6) { wo = Math.min(prog(t, w.t, w.t + 0.2), 1 - prog(t, w.end, w.end + 0.5)); wavePath.style.strokeDashoffset = (1 - prog(t, w.t, w.t + 1.6, E.inOutCubic)).toFixed(3); waveEl.style.transform = `translateX(${(Math.sin(t * 2) * 10).toFixed(1)}px)`; }
    waveEl.style.opacity = wo.toFixed(3);
    // end card
    const e0 = 188.9;
    const ev = t > e0;
    endc.style.opacity = ev ? prog(t, e0, e0 + 0.6).toFixed(3) : '0';
    if (ev) {
      const e1 = endc.querySelector('.e1'), e2 = endc.querySelector('.e2'), e3 = endc.querySelector('.e3'), rib = endc.querySelectorAll('.rib div');
      const a1 = prog(t, e0, e0 + 1.3, E.outQuart), a2 = prog(t, e0 + 1.2, e0 + 2.5, E.outQuart);
      e1.style.clipPath = `inset(-30px 0 -30px ${((1 - a1) * 100).toFixed(1)}%)`; e2.style.clipPath = `inset(-30px 0 -30px ${((1 - a2) * 100).toFixed(1)}%)`;
      e1.style.backgroundPosition = e2.style.backgroundPosition = `${(100 - prog(t, e0 + 2.2, e0 + 4.6, E.inOutSine) * 100).toFixed(1)}% 0`;
      const wr = prog(t, e0 + 0.7, e0 + 1.7, E.inOutCubic), widths = [90, 90, 90, 18, 270];
      rib.forEach((d, k) => { d.style.width = (widths[k] * wr).toFixed(1) + 'px'; });
      e3.style.opacity = prog(t, e0 + 2.6, e0 + 3.4).toFixed(3);
      const sc = 1 + 0.03 * prog(t, e0, DUR, E.linear); endc.style.transform = `scale(${sc.toFixed(4)})`;
    }
  }

  /* ---------- letterbox, flashes, dips ---------- */
  function bars(t, s) {
    let k = 0;
    if (t < 20.6) k = 1 - prog(t, 19.6, 20.5, E.inOutCubic);
    if (s.bars) k = Math.max(k, Math.min(prog(t, LS(25) - 0.4, LS(25) + 0.6, E.inOutCubic), 1 - prog(t, LS(29) - 0.6, LS(29) - 0.1, E.inOutCubic)));
    if (t > 188.6) k = prog(t, 188.6, 189.8, E.inOutCubic);
    const y = (1 - k) * 100;
    $('#barT').style.transform = `translateY(-${y.toFixed(2)}%)`; $('#barB').style.transform = `translateY(${y.toFixed(2)}%)`;
  }
  function transitions(t, s) {
    let fl = 0, bl = 0;
    if (s.tin === 'flash') fl = 0.75 * Math.exp(-(t - s.t) * 7);
    if (s.kick) fl = Math.max(fl, 0.07 * kickPulse(t));
    if (s.tin === 'black') bl = 1 - prog(t, 0.2, 2.6, E.inOutSine);
    if (s.tin === 'dip') bl = Math.max(bl, 1 - prog(t, s.t, s.t + 0.5, E.inOutSine));
    const nx = SH[SH.indexOf(s) + 1];
    if (nx && nx.tin === 'dip') bl = Math.max(bl, prog(t, nx.t - 0.45, nx.t, E.inOutSine));
    bl = Math.max(bl, prog(t, DUR - 2.2, DUR - 0.25, E.inOutSine));
    flash.style.opacity = fl.toFixed(3); black.style.opacity = bl.toFixed(3);
  }
  function gradeAt(t, s) {
    const cur = G[s.grade || (s.prev && s.prev.grade) || 'warm'];
    let g = cur;
    let pg = s.prev ? G[s.prev.grade || 'warm'] : cur;
    const k = prog(t, s.t, s.t + (s.tin === 'cut' || s.tin === 'whip' || s.tin === 'flash' ? 0.01 : 0.7), E.inOutSine);
    g = {}; gradeKeys.forEach((key) => { g[key] = lerp(pg[key], cur[key], k); });
    g.wash = cur.wash.map((v, i) => lerp(pg.wash[i], v, k));
    return g;
  }

  /* ---------- frame ---------- */
  let frameNo = 0;
  function render(t) {
    t = Math.max(0, Math.min(DUR, t));
    const s = shotAt(t);
    const st = camState(s, t);
    warpFlags(t);
    drawWorld(ctx, st, t);
    // dissolve: blend the continuing previous shot
    if (s.tin === 'dissolve' && s.prev && t < s.t + 0.9) {
      const k = prog(t, s.t, s.t + 0.9, E.inOutSine);
      const pc = prevC.getContext('2d'); drawWorld(pc, camState(s.prev, t), t);
      ctx.globalAlpha = 1 - k; ctx.drawImage(prevC, 0, 0); ctx.globalAlpha = 1;
    }
    // whip-pan motion blur
    const wa = whipAmount(t);
    if (wa > 0.02) {
      const tc = tmpC.getContext('2d'); tc.drawImage(cv, 0, 0);
      const n = 9, span = 150 * wa;
      for (let k = 1; k < n; k++) { ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(tmpC, (k / (n - 1) - 0.5) * span * 2, 0); }
      ctx.globalAlpha = 1;
    }
    const g = gradeAt(t, s);
    ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = `rgba(${g.wash[0] | 0},${g.wash[1] | 0},${g.wash[2] | 0},${(g.wash[3] * 3).toFixed(3)})`; ctx.fillRect(0, 0, W, H); ctx.restore();
    atmosphere(ctx, t, st, g);
    confetti(ctx, t, s.confetti ? prog(t, s.t, s.t + 0.5) : (s.prev && s.prev.confetti && t < s.t + 0.6 ? 1 - prog(t, s.t, s.t + 0.6) : 0));
    ctx.drawImage(vignette, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07; ctx.drawImage(grain[Math.floor(t * FPS) % 4], 0, 0, W, H); ctx.restore();
    cv.style.filter = `saturate(${g.sat.toFixed(3)}) contrast(${g.con.toFixed(3)}) brightness(${g.bri.toFixed(3)}) sepia(${g.sep.toFixed(3)})`;
    captions(t); overlays(t); bars(t, s); transitions(t, s);
    frameNo++;
  }

  const ready = (async () => {
    await Promise.all(['700 96px "Aref Ruqaa"', '800 70px Cairo', '700 82px Amiri', '600 30px "Reem Kufi"'].map((f) => document.fonts.load(f, 'مصر')));
    await document.fonts.ready;
    await prepare();
    render(0);
  })();
  window.__kosifReady = ready;
  window.__kosif = { duration: DUR, fps: FPS, seek: async (t) => { await ready; render(t); } };

  /* ---------- live preview controls (not used by the renderer) ---------- */
  const aud = $('#aud'), scrub = $('#scrub'), tv = $('#tv');
  if (navigator.webdriver) $('#controls').style.display = 'none';
  let playing = false;
  $('#play').onclick = () => { playing = !playing; if (playing) { aud.currentTime = +scrub.value; aud.play(); loop(); } else aud.pause(); };
  scrub.oninput = () => { aud.currentTime = +scrub.value; ready.then(() => render(+scrub.value)); tv.textContent = (+scrub.value).toFixed(2); };
  function loop() { if (!playing) return; const t = aud.currentTime; scrub.value = t; tv.textContent = t.toFixed(2); render(t); requestAnimationFrame(loop); }
})();
</script>
</body>
</html>

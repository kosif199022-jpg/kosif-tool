<!-- eclipse-cta.html: the closing call to action. A lens star twinkles in the dark, shrinks away,
     then a black disc rises with a slow turning corona behind the headline. Plays once at 30% visible.
     Change --accent to the brand colour. Works on any dark page. -->
<style>
.eclipse-cta{--accent:#5266eb;position:relative;height:110vh;min-height:720px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#12121a,#0b0b10 60%);color:#fff}
.eclipse-cta:before{content:"";position:absolute;left:0;right:0;top:0;height:30vh;background:linear-gradient(var(--page-bg,#171721),transparent);z-index:1}
.eclipse-cta .star{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;z-index:2;pointer-events:none;transition:transform 1.3s cubic-bezier(.65,0,.35,1),opacity 1s;animation:tw 2.6s ease-in-out infinite}
.eclipse-cta .star i{position:absolute;left:50%;top:50%;border-radius:99px;background:linear-gradient(90deg,transparent,#dfe4ff,transparent);width:220px;height:2px;margin:-1px 0 0 -110px}
.eclipse-cta .star i+i{width:2px;height:220px;margin:-110px 0 0 -1px;background:linear-gradient(180deg,transparent,#dfe4ff,transparent)}
.eclipse-cta .star b{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff;box-shadow:0 0 22px 8px rgba(160,175,255,.85),0 0 70px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
@keyframes tw{50%{filter:brightness(1.35)}}
.eclipse-cta.go .star{transform:scale(.18);opacity:0}
.eclipse-cta .ring{position:absolute;left:50%;top:50%;width:min(46vw,520px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:2;pointer-events:none;transition:transform 2.2s cubic-bezier(.16,1,.3,1) .7s,opacity 1.6s .7s}
.eclipse-cta.go .ring{transform:translate(-50%,-50%) scale(1);opacity:1}
.eclipse-cta .corona{position:absolute;inset:-14%;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(143,160,255,.9),#fff,rgba(201,167,255,.7),color-mix(in srgb,var(--accent) 20%,transparent),rgba(143,227,255,.8),transparent);filter:blur(26px);animation:spin 18s linear infinite}
.eclipse-cta .halo{position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 35%,transparent),transparent 62%);animation:breathe 5s ease-in-out infinite}
.eclipse-cta .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#0d0d14,#050508 70%);box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 0 18px 4px rgba(220,226,255,.8)}
@keyframes spin{to{transform:rotate(1turn)}}@keyframes breathe{50%{transform:scale(1.08);opacity:.7}}
.eclipse-cta .copy{position:relative;z-index:3;text-align:center;max-width:620px;padding:0 24px}
.eclipse-cta .copy>*{opacity:0;transform:translateY(14px);filter:blur(5px);transition:all .9s cubic-bezier(.16,1,.3,1)}
.eclipse-cta.go .copy>*{opacity:1;transform:none;filter:none}
.eclipse-cta.go .copy>:nth-child(1){transition-delay:1.1s}.eclipse-cta.go .copy>:nth-child(2){transition-delay:1.25s}.eclipse-cta.go .copy>:nth-child(3){transition-delay:1.4s}
@media (max-width:860px){.eclipse-cta .ring{width:88vw}}
@media (prefers-reduced-motion:reduce){.eclipse-cta .star{display:none}.eclipse-cta .ring,.eclipse-cta .copy>*{opacity:1;transform:translate(-50%,-50%);transition:none}.eclipse-cta .copy>*{transform:none;filter:none}}
</style>
<section class="eclipse-cta" id="talk">
  <div class="star"><i></i><i></i><b></b></div>
  <div class="ring"><div class="halo"></div><div class="corona"></div><div class="disc"></div></div>
  <div class="copy"><h2>Let's build your place.</h2><p>We reply within a day.</p><a class="pill" href="#">Start a project</a></div>
</section>
<script>new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('go'); o.disconnect(); } }), { threshold: .3 }).observe(document.querySelector('.eclipse-cta'));</script>

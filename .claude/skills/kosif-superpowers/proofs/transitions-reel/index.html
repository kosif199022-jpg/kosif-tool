<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transitions Reel — KOSIF proof</title>
<style>
  @font-face { font-family: "Cairo"; src: url("../_shared/fonts/Cairo[slnt,wght].ttf") format("truetype"); font-weight: 200 1000; font-display: block; }
  @font-face { font-family: "Grotesk"; src: url("../_shared/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Mono"; src: url("../_shared/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #fit { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  canvas { display: block; width: 1080px; height: 1920px; }
  #hud { position: fixed; left: 10px; bottom: 10px; font: 13px system-ui, sans-serif; color: #9ab; direction: ltr; }
  body.render #hud { display: none; }
</style>
</head>
<body>
<div id="fit"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hud">space: play/pause · ←/→: frame · ?t=4.5</div>
<script src="reel.js"></script>
<script>
(function () {
  'use strict';
  const W = 1080, H = 1920, FPS = 30;
  const { DURATION, CARDS, TRANSITIONS } = window.REEL;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const A = mk(), B = mk(), T1 = mk(), T2 = mk();
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x), lerp = (a, b, p) => a + (b - a) * p;
  const E = {
    linear: (x) => x,
    inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
    inOutQuint: (x) => (x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2),
    inOutQuart: (x) => (x < 0.5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2),
    inExpo: (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10)),
    outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
    outCubic: (x) => 1 - Math.pow(1 - x, 3),
    outBack: (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  };
  // curve shown in the HUD for each transition (same functions the transition uses)
  const CURVE = {
    iris: E.inOutCubic, wipe: E.inOutQuint, zoom: (u) => (u < 0.5 ? E.inExpo(u * 2) / 2 : 0.5 + E.outExpo(u * 2 - 1) / 2),
    glitch: (u) => 1 - Math.abs(2 * u - 1), whip: E.inOutQuart, leak: (u) => Math.pow(Math.sin(Math.PI * u), 1.2), shape: E.inOutCubic, match: E.inOutCubic,
  };
  function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
  const MC = [540, 800];   // motif centre (every transition is anchored here)

  /* ======================= cards (drawn live, so holds keep moving) ======================= */
  function cardEnter(i) { return i === 0 ? 0.12 : TRANSITIONS[i].cut; }
  function drawCard(g, i, t, opts = {}) {
    const c = CARDS[i];
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
    const gr = g.createLinearGradient(0, 0, W * 0.4, H); gr.addColorStop(0, c.bg[1]); gr.addColorStop(1, c.bg[0]);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // giant outline index number
    g.save(); g.globalAlpha = 0.13; g.strokeStyle = c.ink; g.lineWidth = 4; g.font = '700 560px Grotesk'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.strokeText(String(i).padStart(2, '0'), 540 + Math.sin(t * 0.7 + i) * 10, 1820); g.restore();
    if (!opts.noMotif) drawMotif(g, i, t, MC[0], MC[1], 1);
    // texts enter after the cut (whole Arabic line, clip revealed right → left)
    const le = t - cardEnter(i);
    const p1 = E.outExpo(clamp01(le / 0.45)), p2 = E.outExpo(clamp01((le - 0.08) / 0.45)), p3 = E.outExpo(clamp01((le - 0.16) / 0.45));
    g.fillStyle = c.ink; g.textAlign = 'center';
    // top counter
    g.font = '700 40px Grotesk'; g.textBaseline = 'middle'; g.globalAlpha = 0.8 * p1; g.direction = 'ltr';
    g.textAlign = 'left'; g.fillText(i === 0 ? 'KOSIF · PROOF' : `${String(i).padStart(2, '0')} / 08`, 92, 190);
    g.textAlign = 'right'; g.font = '800 44px Cairo'; g.direction = 'rtl'; g.fillText(i === 0 ? 'استعراض' : 'انتقال', 988, 188);
    g.globalAlpha = 1;
    // Arabic label: fit to 900 px, reveal with a right-anchored clip
    let px = i === 0 ? 132 : 128; g.font = `900 ${px}px Cairo`; g.direction = 'rtl';
    const wAr = g.measureText(c.ar).width; if (wAr > 900) { px = Math.floor(px * 900 / wAr); g.font = `900 ${px}px Cairo`; }
    const wFit = Math.min(900, wAr);
    g.save(); g.beginPath(); const rx = 540 + wFit / 2 + 30; g.rect(rx - (wFit + 60) * p1, 1160, (wFit + 60) * p1, 260); g.clip();
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillText(c.ar, 540 + (1 - p1) * 40, 1340); g.restore();
    // English label + spec line
    g.direction = 'ltr'; g.textAlign = 'center';
    g.globalAlpha = p2; g.font = '700 58px Grotesk'; spaced(g, c.en, 540, 1440 + (1 - p2) * 36, 7);
    if (i > 0) { g.globalAlpha = 0.78 * p3; g.font = '500 36px Mono'; g.fillText(`${TRANSITIONS[i].dur.toFixed(2)} s · ${TRANSITIONS[i].ease}`, 540, 1530 + (1 - p3) * 30); }
    else { g.globalAlpha = 0.78 * p3; g.font = '500 36px Mono'; g.fillText('120 BPM · 1 cut / 2 beats', 540, 1530 + (1 - p3) * 30); }
    g.globalAlpha = 1;
  }
  function spaced(g, s, cx, y, sp) {
    const ws = [...s].map((ch) => g.measureText(ch).width), total = ws.reduce((a, b) => a + b, 0) + sp * (s.length - 1);
    let x = cx - total / 2; g.textAlign = 'left';
    [...s].forEach((ch, k) => { g.fillText(ch, x, y); x += ws[k] + sp; }); g.textAlign = 'center';
  }

  function drawMotif(g, i, t, cx, cy, k) {
    const c = CARDS[i], m = c.motif;
    g.save(); g.translate(cx, cy); g.scale(k, k);
    const bob = Math.sin(t * 2.2 + i) * 8;
    g.translate(0, bob);
    if (m === 'rings') {
      for (let r = 0; r < 5; r++) { g.strokeStyle = r % 2 ? c.ink : c.accent; g.globalAlpha = 0.9 - r * 0.14; g.lineWidth = 14; g.setLineDash([60 + r * 20, 34]); g.lineDashOffset = (r % 2 ? 1 : -1) * t * 160; g.beginPath(); g.arc(0, 0, 80 + r * 52, 0, Math.PI * 2); g.stroke(); }
      g.setLineDash([]); g.globalAlpha = 1; g.fillStyle = c.accent; g.beginPath(); g.arc(0, 0, 44, 0, Math.PI * 2); g.fill();
    } else if (m === 'ring') {
      g.strokeStyle = c.ink; g.lineWidth = 38; g.beginPath(); g.arc(0, 0, 210, 0, Math.PI * 2); g.stroke();
      g.fillStyle = c.accent; const a = t * 2.4; g.beginPath(); g.arc(Math.cos(a) * 210, Math.sin(a) * 210, 34, 0, Math.PI * 2); g.fill();
      g.fillStyle = c.ink; g.beginPath(); g.arc(0, 0, 70, 0, Math.PI * 2); g.fill();
    } else if (m === 'stripes') {
      g.save(); g.beginPath(); g.arc(0, 0, 230, 0, Math.PI * 2); g.clip(); g.rotate(-0.5);
      g.fillStyle = c.accent; for (let x = -400; x < 400; x += 70) g.fillRect(x + ((t * 120) % 70), -300, 34, 600); g.restore();
      g.strokeStyle = c.ink; g.lineWidth = 12; g.beginPath(); g.arc(0, 0, 230, 0, Math.PI * 2); g.stroke();
    } else if (m === 'tunnel') {
      for (let r = 0; r < 7; r++) { const s = ((r / 7 + t * 0.35) % 1); const z = 40 + s * 420; g.strokeStyle = c.ink; g.globalAlpha = s; g.lineWidth = 6 + 10 * s; g.strokeRect(-z / 2, -z / 2, z, z); }
      g.globalAlpha = 1; g.fillStyle = c.accent; g.fillRect(-24, -24, 48, 48);
    } else if (m === 'pixels') {
      for (let y = -4; y < 4; y++) for (let x = -4; x < 4; x++) { const h = hash(x * 13 + y * 7 + Math.floor(t * 6) * 3); if (h > 0.45) { g.fillStyle = h > 0.82 ? c.accent : c.ink; g.globalAlpha = 0.35 + h * 0.65; g.fillRect(x * 56 + 3, y * 56 + 3, 50, 50); } }
      g.globalAlpha = 1;
    } else if (m === 'speed') {
      g.strokeStyle = c.ink; g.lineCap = 'round';
      for (let k2 = 0; k2 < 7; k2++) { const y = -180 + k2 * 60, l = 140 + hash(k2) * 220, x = ((t * 900 + hash(k2 + 9) * 700) % 900) - 450; g.lineWidth = 16; g.globalAlpha = 0.6; g.beginPath(); g.moveTo(x - l, y); g.lineTo(x, y); g.stroke(); }
      g.globalAlpha = 1; g.fillStyle = c.accent; g.beginPath(); g.moveTo(-120, -110); g.lineTo(150, 0); g.lineTo(-120, 110); g.closePath(); g.fill();
    } else if (m === 'sun') {
      g.rotate(t * 0.4); g.fillStyle = c.accent;
      for (let r = 0; r < 16; r++) { g.rotate(Math.PI / 8); g.globalAlpha = 0.55; g.fillRect(150, -10, 110, 20); }
      g.globalAlpha = 1; const rg = g.createRadialGradient(0, 0, 10, 0, 0, 130); rg.addColorStop(0, '#fff3c4'); rg.addColorStop(1, c.accent); g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 125, 0, Math.PI * 2); g.fill();
    } else if (m === 'circle') {
      morphShape(g, 0, c.accent, 0);
    } else if (m === 'square') {
      morphShape(g, 1, c.accent, 0);
    }
    g.restore();
  }
  // circle (u=0, r 230) ↔ rounded square (u=1, 440 px, radius 60, 12°)
  function morphShape(g, u, color, squash) {
    const size = lerp(460, 440, u), r = lerp(230, 60, u), rot = lerp(0, 12, u) * Math.PI / 180;
    g.save(); g.rotate(rot); g.scale(1 + squash * 0.12, 1 - squash * 0.12);
    g.fillStyle = color; g.beginPath(); g.roundRect(-size / 2, -size / 2, size, size, r); g.fill();
    g.fillStyle = 'rgba(255,255,255,.22)'; g.beginPath(); g.roundRect(-size / 2 + 40, -size / 2 + 36, size * 0.38, 26, 13); g.fill();
    g.restore();
  }

  /* ======================= transitions ======================= */
  function drawFull(src) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.drawImage(src, 0, 0); }
  const TR = {
    iris(u, a, b) {
      const e = E.inOutCubic(u);
      ctx.save(); ctx.translate(MC[0], MC[1]); ctx.scale(1 - 0.05 * e, 1 - 0.05 * e); ctx.translate(-MC[0], -MC[1]); ctx.drawImage(a, 0, 0); ctx.restore();
      const r = e * 2100;
      ctx.save(); ctx.beginPath(); ctx.arc(MC[0], MC[1], r, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(b, 0, 0); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * (1 - e)) + ')'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(MC[0], MC[1], r + 8, 0, Math.PI * 2); ctx.stroke();
    },
    wipe(u, a, b) {
      const e = E.inOutQuint(u), F = 220, ang = 15 * Math.PI / 180;
      drawFull(a);
      // edge travels right → left (RTL reading direction); a 15° tilted gradient is the mask
      const span = W + Math.tan(ang) * H + F * 2, x = W + F - e * span;
      const g = T1.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'copy'; g.drawImage(b, 0, 0);
      g.globalCompositeOperation = 'destination-in';
      g.save(); g.translate(x, 0); g.transform(1, 0, -Math.tan(ang), 1, 0, 0);
      const gr = g.createLinearGradient(0, 0, F, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)');
      g.fillStyle = gr; g.fillRect(0, -100, F, H * 1.5); g.fillStyle = '#000'; g.fillRect(F, -100, W * 3, H * 1.5);
      g.restore();
      ctx.drawImage(T1, 0, 0);
    },
    zoom(u, a, b) {
      if (u < 0.5) {
        const v = E.inExpo(u * 2), s = 1 + 5 * v;
        ctx.save(); ctx.filter = `blur(${(18 * v).toFixed(1)}px)`; ctx.translate(MC[0], MC[1]); ctx.scale(s, s); ctx.translate(-MC[0], -MC[1]); ctx.drawImage(a, 0, 0); ctx.restore();
      } else {
        const v = E.outExpo(u * 2 - 1), s = lerp(0.6, 1, v);
        ctx.fillStyle = CARDS[curIn].bg[0]; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.filter = `blur(${(14 * (1 - v)).toFixed(1)}px)`; ctx.translate(MC[0], MC[1]); ctx.scale(s, s); ctx.translate(-MC[0], -MC[1]); ctx.drawImage(b, 0, 0); ctx.restore();
      }
      const fl = Math.exp(-Math.pow((u - 0.5) / 0.07, 2)); ctx.fillStyle = `rgba(255,255,255,${0.85 * fl})`; ctx.fillRect(0, 0, W, H);
    },
    glitch(u, a, b, frame) {
      const k = 1 - Math.abs(2 * u - 1);
      // near the cut the source flickers between both cards (seeded per frame)
      const src = (u < 0.5) !== (hash(frame * 3.1) < 0.35 * k) ? a : b;
      const g = T1.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      const off = 42 * k, chans = [['#ff0000', -off, -6 * k], ['#00ff00', 0, 0], ['#0000ff', off, 6 * k]];
      for (const [col, dx, dy] of chans) {
        g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'copy'; g.drawImage(src, 0, 0);
        g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(T1, dx, dy);
      }
      ctx.globalCompositeOperation = 'source-over';
      // horizontal slice displacement
      const g2 = T2.getContext('2d'); g2.globalCompositeOperation = 'copy'; g2.drawImage(cv, 0, 0);
      for (let s = 0; s < 9; s++) {
        const h0 = hash(frame * 17 + s), y = Math.floor(h0 * H), hh = 20 + hash(frame * 5 + s * 3) * 140, dx = (hash(frame * 11 + s * 7) - 0.5) * 280 * k;
        if (hash(s * 29 + frame) < 0.25 + 0.7 * k) ctx.drawImage(T2, 0, y, W, hh, dx, y, W, hh);
      }
      // scanlines + noise blocks
      ctx.fillStyle = `rgba(0,0,0,${0.18 * k})`; for (let y = 0; y < H; y += 6) ctx.fillRect(0, y, W, 2);
      for (let s = 0; s < 14; s++) { if (hash(frame * 7 + s * 13) > k) continue; ctx.fillStyle = hash(s + frame) > 0.5 ? '#36f1cd' : '#ff2bd6'; ctx.globalAlpha = 0.7; ctx.fillRect(hash(s * 3 + frame) * W, hash(s * 5 + frame * 2) * H, 30 + hash(s) * 200, 6 + hash(s * 9) * 20); }
      ctx.globalAlpha = 1;
    },
    whip(u, a, b, frame, t, tr) {
      // velocity-matched motion blur: average 12 sub-frame positions across a 180° shutter (1/60 s)
      const N = 12, shutter = 1 / 60;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      for (let s = 0; s < N; s++) {
        const ts = t - shutter / 2 + shutter * (s + 0.5) / N, us = clamp01((ts - tr.t0) / tr.dur), x = W * E.inOutQuart(us);
        ctx.globalAlpha = 1 / (s + 1);                          // running average
        ctx.drawImage(a, x, 0); ctx.drawImage(b, x - W, 0);
      }
      ctx.globalAlpha = 1;
    },
    leak(u, a, b, frame) {
      drawFull(u < 0.5 ? a : b);
      const k = Math.pow(Math.sin(Math.PI * u), 1.2);
      ctx.globalCompositeOperation = 'lighter';
      const blobs = [[-0.2, 0.15, '255,120,0', 900], [1.1, 0.4, '255,200,40', 1000], [0.3, 0.9, '255,0,110', 800], [0.8, 0.05, '255,170,90', 700]];
      for (const [bx, by, col, r] of blobs) {
        const x = (bx + (u - 0.5) * 0.6) * W, y = (by + (u - 0.5) * 0.25) * H, rr = r * (0.7 + 0.6 * k);
        const g = ctx.createRadialGradient(x, y, 0, x, y, rr); g.addColorStop(0, `rgba(${col},${0.95 * k})`); g.addColorStop(0.45, `rgba(${col},${0.4 * k})`); g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
      ctx.globalCompositeOperation = 'source-over';
      const wo = Math.exp(-Math.pow((u - 0.5) / 0.11, 2)); ctx.fillStyle = `rgba(255,246,228,${0.92 * wo})`; ctx.fillRect(0, 0, W, H);
      // film-burn speckle
      for (let s = 0; s < 40; s++) { if (hash(s * 7 + frame) > k) continue; ctx.fillStyle = `rgba(255,${180 + hash(s) * 70 | 0},120,${0.5 * k})`; ctx.beginPath(); ctx.arc(hash(s * 3 + frame * 1.3) * W, hash(s * 11 + frame * 0.7) * H, 2 + hash(s * 5) * 8, 0, Math.PI * 2); ctx.fill(); }
    },
    shape(u, a, b) {
      drawFull(a);
      const e = E.inOutCubic(u), rot = E.outCubic(u) * 100 * Math.PI / 180;
      const star = (g, R) => { g.beginPath(); for (let k = 0; k < 12; k++) { const ang = rot + k * Math.PI / 6, rr = k % 2 ? R * 0.62 : R; g.lineTo(MC[0] + Math.cos(ang) * rr, MC[1] + Math.sin(ang) * rr); } g.closePath(); };
      const R = e * 2600;
      ctx.save(); star(ctx, R); ctx.clip(); ctx.drawImage(b, 0, 0); ctx.restore();
      const R2 = E.inOutCubic(clamp01(u * 1.12)) * 2600 + 30;
      ctx.strokeStyle = `rgba(255,255,255,${0.95 * (1 - e)})`; ctx.lineWidth = 18; ctx.lineJoin = 'round'; star(ctx, R2); ctx.stroke();
    },
    match(u, a, b, frame, t) {
      // backgrounds cut at the morph midpoint; the shape carries the eye across the cut
      const e = E.inOutCubic(u);
      drawCard(T1.getContext('2d'), u < 0.5 ? curIn - 1 : curIn, t, { noMotif: true }); drawFull(T1);
      const c0 = CARDS[curIn - 1].accent, c1 = CARDS[curIn].accent;
      const squash = Math.sin(Math.PI * e);
      ctx.save(); ctx.translate(MC[0], MC[1] + Math.sin((t) * 2.2 + (u < 0.5 ? curIn - 1 : curIn)) * 8 - squash * 40);
      ctx.scale(1 + 0.18 * squash, 1 + 0.18 * squash);
      morphShape(ctx, e, mixHex(c0, c1, e), squash * (u < 0.5 ? 1 : -1));
      ctx.restore();
    },
  };
  function mixHex(a, b, p) { const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16)); return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], p))).join(',')})`; }

  /* ======================= HUD: progress pills + live easing curve ======================= */
  function hud(t, active, u) {
    const y = 1700;
    // pills
    for (let k = 1; k <= 8; k++) {
      const x = 540 + (k - 4.5) * 74, done = t >= TRANSITIONS[k].cut, on = active === k;
      ctx.fillStyle = on ? '#ffffff' : done ? 'rgba(255,255,255,.75)' : 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.roundRect(x - (on ? 26 : 12), y - 6, on ? 52 : 24, 12, 6); ctx.fill();
    }
    // curve card (shows the easing of the running — or last — transition)
    const k = active || Math.max(0, ...TRANSITIONS.map((tr, i) => (tr && t >= tr.t1 ? i : 0)));
    if (!k) return;
    const tr = TRANSITIONS[k], f = CURVE[tr.id], uu = active ? u : 1;
    const bx = 330, by = 1760, bw = 420, bh = 90;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let s = 0; s <= 40; s++) { const x = bx + 20 + s / 40 * 130, yy = by + bh - 16 - f(s / 40) * (bh - 32); s ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath();
    for (let s = 0; s <= 40 * uu; s++) { const x = bx + 20 + s / 40 * 130, yy = by + bh - 16 - f(s / 40) * (bh - 32); s ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx + 20 + uu * 130, by + bh - 16 - f(uu) * (bh - 32), 7, 0, Math.PI * 2); ctx.fill();
    ctx.font = '500 26px Mono'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.direction = 'ltr';
    ctx.fillText(tr.ease, bx + 172, by + 32); ctx.globalAlpha = 0.7; ctx.fillText(`${tr.dur.toFixed(2)} s · u=${uu.toFixed(2)}`, bx + 172, by + 62); ctx.globalAlpha = 1;
  }

  /* ======================= frame ======================= */
  let curIn = 0;
  function render(t) {
    const frame = Math.round(t * FPS);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    let active = 0, u = 0;
    for (let k = 1; k < TRANSITIONS.length; k++) { const tr = TRANSITIONS[k]; if (t >= tr.t0 && t < tr.t1) { active = k; u = (t - tr.t0) / tr.dur; } }
    if (active) {
      curIn = active; const tr = TRANSITIONS[active];
      drawCard(A.getContext('2d'), active - 1, t); drawCard(B.getContext('2d'), active, t);
      TR[tr.id](u, A, B, frame, t, tr);
    } else {
      let i = 0; for (let k = 1; k < TRANSITIONS.length; k++) if (t >= TRANSITIONS[k].t1) i = k;
      drawCard(A.getContext('2d'), i, t); drawFull(A);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    hud(t, active, u);
    const fade = Math.max(1 - t / 0.12, (t - (DURATION - 0.25)) / 0.25);
    if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp01(fade)})`; ctx.fillRect(0, 0, W, H); }
  }

  /* ======================= boot + renderer contract ======================= */
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); document.getElementById('fit').style.transform = `scale(${s})`; }
  addEventListener('resize', fit); fit();
  if (navigator.webdriver) document.body.classList.add('render');
  let cur = 0, playing = false, last = 0;
  const seek = (t) => { cur = Math.max(0, Math.min(DURATION, t)); render(cur); };
  const ready = Promise.all([
    document.fonts.load('900 128px Cairo', CARDS.map((c) => c.ar).join(' ')), document.fonts.load('800 44px Cairo', 'انتقال استعراض'),
    document.fonts.load('700 58px Grotesk', 'ABC'), document.fonts.load('500 36px Mono', '0.5 s'),
  ]).then(() => document.fonts.ready).then(() => true);
  window.__kosif = { duration: DURATION, fps: FPS, seek };
  window.__kosifReady = ready;
  ready.then(() => {
    seek(parseFloat(new URLSearchParams(location.search).get('t') || '0') || 0);
    const loop = (now) => { if (!playing) return; cur += (now - last) / 1000; last = now; if (cur > DURATION) cur = 0; render(cur); requestAnimationFrame(loop); };
    addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); playing = !playing; last = performance.now(); if (playing) requestAnimationFrame(loop); }
      if (e.code === 'ArrowRight') seek(cur + 1 / FPS);
      if (e.code === 'ArrowLeft') seek(cur - 1 / FPS);
    });
  });
})();
</script>

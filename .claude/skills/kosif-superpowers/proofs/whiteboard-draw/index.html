<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard Draw — KOSIF proof</title>
<style>
  @font-face { font-family: "Ruqaa"; src: url("../_shared/fonts/ArefRuqaa-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #fit { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  canvas { display: block; width: 1080px; height: 1920px; }
  #hud { position: fixed; left: 10px; bottom: 10px; font: 13px system-ui, sans-serif; color: #9ab; direction: ltr; }
  body.render #hud { display: none; }
</style>
</head>
<body>
<div id="fit"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hud">space: play/pause · ←/→: frame · ?t=4.5</div>
<script src="scene.js"></script>
<script>
(function () {
  'use strict';
  const W = 1080, H = 1920, FPS = 30;
  const { INK, items, clips, DURATION, ease, easeVel, rng } = window.WB_SCENE;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x), lerp = (a, b, p) => a + (b - a) * p;
  const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const outCubic = (x) => 1 - Math.pow(1 - x, 3), inCubic = (x) => x * x * x;

  /* ================= paper: off-white board with subtle texture (built once, seeded) ================= */
  const M = 110, PW = W + 2 * M, PH = H + 2 * M;
  const paper = document.createElement('canvas'); paper.width = PW; paper.height = PH;
  (function buildPaper() {
    const p = paper.getContext('2d'), R = rng(7);
    p.fillStyle = '#f6f3ec'; p.fillRect(0, 0, PW, PH);
    // low-frequency value noise → soft blotches (±2.5 % luminance)
    const G = 24, gw = Math.ceil(PW / G) + 2, gh = Math.ceil(PH / G) + 2, grid = new Float32Array(gw * gh).map(() => R());
    const img = p.getImageData(0, 0, PW, PH), d = img.data;
    for (let y = 0; y < PH; y++) {
      const gy = y / G, iy = gy | 0, fy = gy - iy, uy = fy * fy * (3 - 2 * fy);
      for (let x = 0; x < PW; x++) {
        const gx = x / G, ix = gx | 0, fx = gx - ix, ux = fx * fx * (3 - 2 * fx);
        const a = grid[iy * gw + ix], b = grid[iy * gw + ix + 1], c = grid[(iy + 1) * gw + ix], e = grid[(iy + 1) * gw + ix + 1];
        const n = lerp(lerp(a, b, ux), lerp(c, e, ux), uy);
        const grain = (R() - 0.5) * 7;
        const v = (n - 0.5) * 12 + grain, k = (y * PW + x) * 4;
        d[k] += v; d[k + 1] += v; d[k + 2] += v * 0.9;
      }
    }
    p.putImageData(img, 0, 0);
    // paper fibres
    p.lineCap = 'round';
    for (let i = 0; i < 900; i++) {
      const x = R() * PW, y = R() * PH, a = R() * Math.PI, l = 6 + R() * 22;
      p.strokeStyle = `rgba(120,110,95,${0.025 + R() * 0.045})`; p.lineWidth = 0.6 + R() * 0.8;
      p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (R() - 0.5) * 6, y + Math.sin(a) * l * 0.5 + (R() - 0.5) * 6, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
    }
    // ghosts of an earlier, erased drawing (real boards are never perfectly clean)
    p.filter = 'blur(9px)';
    for (let i = 0; i < 7; i++) {
      p.strokeStyle = `rgba(70,85,110,${0.022 + R() * 0.02})`; p.lineWidth = 30 + R() * 50;
      const x = M + R() * W, y = M + R() * H;
      p.beginPath(); p.moveTo(x, y); p.bezierCurveTo(x + 120, y - 60 * R(), x + 220, y + 80 * R(), x + 320 * R() + 100, y + 30); p.stroke();
    }
    p.filter = 'none';
    // soft board vignette
    const vg = p.createRadialGradient(PW / 2, PH / 2, PH * 0.25, PW / 2, PH / 2, PH * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(60,50,35,0.13)');
    p.fillStyle = vg; p.fillRect(0, 0, PW, PH);
  })();

  /* ================= stroke builder (own perfect-freehand-like outline) =================
   * width_i = size · pressure(speed) · taperStart · taperEnd
   *   pressure = 1.10 − 0.32·(v/vmax)   (fast → lighter, thinner)
   *   taperStart = 0.42 + 0.58·min(1, s/16)   taperEnd = 0.30 + 0.70·min(1, (L−s)/22)
   * outline = left offsets forward + round end cap + right offsets backward + round start cap.
   */
  const VMAX = easeVel(0.5);
  function invEase(y) { let a = 0, b = 1; for (let i = 0; i < 26; i++) { const m = (a + b) / 2; if (ease(m) < y) a = m; else b = m; } return (a + b) / 2; }
  for (const it of items) {
    if (it.type !== 'stroke') continue;
    const n = it.pts.length, w = new Float32Array(n), nx = new Float32Array(n), ny = new Float32Array(n);
    const nzR = rng(Math.round(it.L * 13) + n);
    let jitter = 0;
    for (let i = 0; i < n; i++) {
      const s = it.s[i], u = invEase(s / it.L), v = easeVel(u) / VMAX;
      jitter = jitter * 0.9 + (nzR() - 0.5) * 0.08;                 // felt-tip grain
      const pr = 1.10 - 0.32 * v + jitter;
      const ts = 0.42 + 0.58 * Math.min(1, s / 16), te = 0.30 + 0.70 * Math.min(1, (it.L - s) / 22);
      w[i] = it.size * pr * ts * te;
      const a = it.pts[Math.max(0, i - 3)], b = it.pts[Math.min(n - 1, i + 3)];
      let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      nx[i] = -ty; ny[i] = tx;
    }
    it.w = w; it.nx = nx; it.ny = ny;
    if (it.clip) it.clipPath = polyPath(clips[it.clip]);
  }
  function polyPath(pts) { const p = new Path2D(); pts.forEach((q, i) => (i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1]))); p.closePath(); return p; }

  function strokeOutline(it, Lc) {
    const P = it.pts, S = it.s; let j = 0;
    while (j < P.length - 1 && S[j + 1] <= Lc) j++;
    const left = [], right = [];
    const push = (x, y, w, nx, ny) => { left.push([x + nx * w / 2, y + ny * w / 2]); right.push([x - nx * w / 2, y - ny * w / 2]); };
    for (let i = 0; i <= j; i++) push(P[i][0], P[i][1], it.w[i], it.nx[i], it.ny[i]);
    let ex = P[j][0], ey = P[j][1], ew = it.w[j], enx = it.nx[j], eny = it.ny[j];
    if (j < P.length - 1 && Lc > S[j]) {
      const f = (Lc - S[j]) / (S[j + 1] - S[j]);
      ex = lerp(P[j][0], P[j + 1][0], f); ey = lerp(P[j][1], P[j + 1][1], f); ew = lerp(it.w[j], it.w[j + 1], f);
      push(ex, ey, ew, enx, eny);
    }
    const path = new Path2D();
    path.moveTo(left[0][0], left[0][1]);
    for (let i = 1; i < left.length; i++) path.lineTo(left[i][0], left[i][1]);
    // end cap: n → tangent → −n
    const etx = eny, ety = -enx;
    for (let k = 1; k < 8; k++) { const th = Math.PI * k / 8, c = Math.cos(th), s = Math.sin(th); path.lineTo(ex + (enx * c - etx * s) * ew / 2, ey + (eny * c - ety * s) * ew / 2); }
    for (let i = right.length - 1; i >= 0; i--) path.lineTo(right[i][0], right[i][1]);
    // start cap: −n → −tangent → n
    const sx = P[0][0], sy = P[0][1], sw = it.w[0], snx = it.nx[0], sny = it.ny[0], stx = sny, sty = -snx;
    for (let k = 1; k < 8; k++) { const th = Math.PI * k / 8, c = Math.cos(th), s = Math.sin(th); path.lineTo(sx + (-snx * c + stx * s) * sw / 2, sy + (-sny * c + sty * s) * sw / 2); }
    path.closePath();
    return { path, tip: [ex, ey] };
  }

  /* ================= Arabic text: whole shaped line, revealed right → left with a soft mask ================= */
  const FEATHER = 46;   // soft mask edge width (px)
  function buildText(it) {
    const c = document.createElement('canvas'), g = c.getContext('2d');
    const font = `${it.px}px "Ruqaa"`;
    g.font = font; g.direction = 'rtl'; g.textAlign = 'center';
    const m = g.measureText(it.text);
    const pad = 30, w = Math.ceil(m.actualBoundingBoxLeft + m.actualBoundingBoxRight) + pad * 2, h = Math.ceil(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) + pad * 2;
    c.width = w; c.height = h;
    g.font = font; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = INK[it.ink];
    // centre-aligned: actualBoundingBoxLeft is measured from the anchor x
    g.fillText(it.text, pad + m.actualBoundingBoxLeft, pad + m.actualBoundingBoxAscent);
    it.img = c; it.x0 = it.x - (pad + m.actualBoundingBoxLeft); it.y0 = it.y - (pad + m.actualBoundingBoxAscent);
    it.left = it.x0 + pad; it.right = it.x0 + w - pad;
    // per-column ink centre → the pen tip rides on the letters while "writing"
    const d = g.getImageData(0, 0, w, h).data, col = new Float32Array(w);
    let last = h / 2;
    for (let x = 0; x < w; x++) { let sy = 0, sw = 0; for (let y = 0; y < h; y += 2) { const a = d[(y * w + x) * 4 + 3]; if (a > 60) { sy += y * a; sw += a; } } last = sw ? lerp(last, sy / sw, 0.35) : last; col[x] = last; }
    it.col = col;
    it.start = [it.right, it.y0 + col[w - pad - 1]]; it.end = [it.left, it.y0 + col[pad]];
    it.tmp = document.createElement('canvas'); it.tmp.width = w; it.tmp.height = h;
  }
  function textEdge(it, t) { return lerp(it.right + 10, it.left - FEATHER * 0.6, ease(clamp01((t - it.t0) / (it.t1 - it.t0)))); }
  function drawText(it, t) {
    if (t < it.t0) return;
    const g = it.tmp.getContext('2d'), w = it.tmp.width, h = it.tmp.height;
    g.globalCompositeOperation = 'copy'; g.drawImage(it.img, 0, 0);
    if (t < it.t1) {
      const ex = textEdge(it, t) - it.x0;
      const gr = g.createLinearGradient(ex, 0, ex + FEATHER, 0);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)');
      g.globalCompositeOperation = 'destination-in'; g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }
    ctx.drawImage(it.tmp, it.x0, it.y0);
  }

  /* ================= pen: where is the marker tip at time t? ================= */
  const startOf = (it) => (it.type === 'text' ? it.start : it.pts[0]);
  const endOf = (it) => (it.type === 'text' ? it.end : it.pts[it.pts.length - 1]);
  const ENTER = [1180, 2060], EXIT = [1190, 2080];
  function penAt(t) {
    const first = items[0], last = items[items.length - 1];
    if (t < first.t0) { const u = outCubic(clamp01(t / first.t0)); const a = startOf(first); return { x: lerp(ENTER[0], a[0], u), y: lerp(ENTER[1], a[1], u), lift: 1 - u * 0.9, ink: first.ink, on: false }; }
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (t >= it.t0 && t <= it.t1) {
        const u = clamp01((t - it.t0) / (it.t1 - it.t0));
        if (it.type === 'text') {
          const ex = textEdge(it, t) + FEATHER * 0.15, cx = clamp01((ex - it.x0) / it.tmp.width) * (it.tmp.width - 1);
          const y = it.y0 + it.col[Math.round(cx)] + Math.sin(t * 2 * Math.PI * 7) * it.px * 0.07;
          return { x: ex, y, lift: 0, ink: it.ink, on: true };
        }
        const L = it.L * ease(u); let j = 0; while (j < it.pts.length - 1 && it.s[j + 1] <= L) j++;
        const f = j < it.pts.length - 1 ? (L - it.s[j]) / (it.s[j + 1] - it.s[j]) : 0;
        return { x: lerp(it.pts[j][0], it.pts[Math.min(j + 1, it.pts.length - 1)][0], f), y: lerp(it.pts[j][1], it.pts[Math.min(j + 1, it.pts.length - 1)][1], f), lift: 0, ink: it.ink, on: true };
      }
      const nx = items[i + 1];
      if (nx && t > it.t1 && t < nx.t0) {
        const u = clamp01((t - it.t1) / (nx.t0 - it.t1)), e = inOutCubic(u), a = endOf(it), b = startOf(nx);
        const hop = Math.min(1, Math.hypot(b[0] - a[0], b[1] - a[1]) / 300);
        return { x: lerp(a[0], b[0], e), y: lerp(a[1], b[1], e) - Math.sin(Math.PI * u) * 14 * hop, lift: Math.sin(Math.PI * u) * (0.35 + 0.65 * hop), ink: u < 0.5 ? it.ink : nx.ink, on: false };
      }
    }
    const u = inCubic(clamp01((t - last.t1) / 0.65)), a = endOf(last);
    return { x: lerp(a[0], EXIT[0], u), y: lerp(a[1], EXIT[1], u), lift: Math.min(1, u * 3), ink: last.ink, on: false };
  }

  /* marker sprite: felt nib + grey collar + white barrel with ink-coloured band and end cap */
  function drawPen(p, t) {
    const ang = (52 + 5 * Math.sin(t * 1.3) + (p.on ? 0 : 3 * p.lift)) * Math.PI / 180;
    const sc = 1 + 0.05 * p.lift, col = INK[p.ink];
    const shape = (g) => {
      g.beginPath(); g.moveTo(0, -5); g.lineTo(18, -9); g.lineTo(18, 9); g.lineTo(0, 5); g.closePath();          // nib
      g.moveTo(18, -12); g.lineTo(52, -24); g.lineTo(52, 24); g.lineTo(18, 12); g.closePath();                     // collar
      g.roundRect(50, -26, 330, 52, 10);                                                                            // barrel
    };
    ctx.save();
    // contact / lift shadow
    ctx.save();
    ctx.translate(p.x + 10 + p.lift * 34, p.y + 16 + p.lift * 46); ctx.rotate(ang); ctx.scale(sc, sc);
    ctx.filter = `blur(${6 + p.lift * 10}px)`; ctx.fillStyle = `rgba(40,35,30,${0.28 - p.lift * 0.1})`; shape(ctx); ctx.fill();
    ctx.restore();
    ctx.translate(p.x, p.y - p.lift * 10); ctx.rotate(ang); ctx.scale(sc, sc);
    const cyl = (c0, c1, c2) => { const g = ctx.createLinearGradient(0, -26, 0, 26); g.addColorStop(0, c0); g.addColorStop(0.42, c1); g.addColorStop(1, c2); return g; };
    ctx.beginPath(); ctx.roundRect(50, -26, 330, 52, 10); ctx.fillStyle = cyl('#ffffff', '#eceef1', '#b9bec7'); ctx.fill();
    ctx.fillStyle = col; ctx.globalAlpha = 0.95;
    ctx.fillRect(150, -26, 70, 52);                                     // label band
    ctx.beginPath(); ctx.roundRect(318, -27, 66, 54, 12); ctx.fill();  // posted cap
    ctx.globalAlpha = 1;
    ctx.fillStyle = cyl('rgba(255,255,255,.55)', 'rgba(255,255,255,0)', 'rgba(0,0,0,.18)'); ctx.fillRect(150, -26, 70, 52); ctx.beginPath(); ctx.roundRect(318, -27, 66, 54, 12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(18, -12); ctx.lineTo(52, -24); ctx.lineTo(52, 24); ctx.lineTo(18, 12); ctx.closePath(); ctx.fillStyle = cyl('#e7e9ec', '#c4c9d0', '#868c96'); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(18, -9); ctx.lineTo(18, 9); ctx.lineTo(0, 5); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    ctx.restore();
  }

  /* ================= frame ================= */
  const camKey = (t) => { let sx = 0, sy = 0, n = 0; for (let k = 0; k < 10; k++) { const tt = t - 0.9 * k / 9; const p = penAt(Math.max(0, tt)); sx += p.x; sy += p.y; n++; } return [sx / n, sy / n]; };
  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
    // camera: slow push 1.02 → 1.06 plus a gentle follow of the pen (7 % of its offset from centre, averaged over 0.9 s)
    const [fx, fy] = camKey(t), hold = clamp01((t - 9.2) / 0.8);
    const k = 0.07 * (1 - inOutCubic(hold));
    const cx = (fx - W / 2) * k, cy = Math.max(-60, Math.min(60, (fy - H / 2) * k));
    const sc = 1.02 + 0.04 * inOutCubic(clamp01(t / DURATION));
    ctx.setTransform(sc, 0, 0, sc, W / 2 - sc * (W / 2 + cx), H / 2 - sc * (H / 2 + cy));
    ctx.drawImage(paper, -M, -M);
    // ink layer: marker ink multiplies with the board, so crossings darken like real marker
    ctx.globalCompositeOperation = 'multiply';
    for (const it of items) {
      if (t < it.t0) break;
      if (it.type === 'text') { drawText(it, t); continue; }
      const u = clamp01((t - it.t0) / (it.t1 - it.t0));
      const { path } = strokeOutline(it, it.L * ease(u));
      ctx.globalAlpha = it.hatch ? 0.78 : 0.94; ctx.fillStyle = INK[it.ink];
      if (it.clipPath) { ctx.save(); ctx.clip(it.clipPath); ctx.fill(path); ctx.restore(); } else ctx.fill(path);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const p = penAt(t);
    if (p.x < W + 420 && p.y < H + 420) drawPen(p, t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // 0.25 s fade from white at the head
    const fade = 1 - clamp01(t / 0.25);
    if (fade > 0) { ctx.fillStyle = `rgba(246,243,236,${fade})`; ctx.fillRect(0, 0, W, H); }
  }

  /* ================= boot + renderer contract ================= */
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); document.getElementById('fit').style.transform = `scale(${s})`; }
  addEventListener('resize', fit); fit();
  if (navigator.webdriver) document.body.classList.add('render');
  let cur = 0, playing = false, last = 0;
  const seek = (t) => { cur = Math.max(0, Math.min(DURATION, t)); render(cur); };
  const ready = Promise.all(items.filter((i) => i.type === 'text').map((i) => document.fonts.load(`${i.px}px "Ruqaa"`, i.text)))
    .then(() => document.fonts.ready)
    .then(() => { items.filter((i) => i.type === 'text').forEach(buildText); return true; });
  window.__kosif = { duration: DURATION, fps: FPS, seek: (t) => seek(t) };
  window.__kosifReady = ready;
  ready.then(() => {
    seek(parseFloat(new URLSearchParams(location.search).get('t') || '0') || 0);
    const loop = (now) => { if (!playing) return; cur += (now - last) / 1000; last = now; if (cur > DURATION) cur = 0; render(cur); requestAnimationFrame(loop); };
    addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); playing = !playing; last = performance.now(); if (playing) requestAnimationFrame(loop); }
      if (e.code === 'ArrowRight') seek(cur + 1 / FPS);
      if (e.code === 'ArrowLeft') seek(cur - 1 / FPS);
    });
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texture Lab — KOSIF proof</title>
<style>
  @font-face { font-family: "TLalezar"; src: url("../_shared/fonts/Lalezar-Regular.ttf") format("truetype"); }
  @font-face { font-family: "TCairo"; src: url("../_shared/fonts/cairo-arabic-600-normal.woff2") format("woff2"); font-weight: 600; unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "TCairo"; src: url("../_shared/fonts/cairo-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "TGrotesk"; src: url("../_shared/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "TMono"; src: url("../_shared/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #fit { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  canvas { display: block; }
  #hud { position: fixed; left: 10px; bottom: 10px; font: 13px/1.3 system-ui, sans-serif; color: #9ab; }
  body.render #hud { display: none; }
</style>
</head>
<body>
<div id="fit"><canvas id="out" width="1920" height="1080"></canvas></div>
<div id="hud">space = play/pause · ←/→ = ±1 frame · ?t=4.5</div>
<script>
(function () {
  'use strict';
  const W = 1920, H = 1080, FPS = 30, DUR = 8;
  const M = 48, GUT = 24, PW = (W - 2 * M - GUT) / 2, PH = (H - 2 * M - GUT) / 2;   // 900 × 480 panels
  /* ---------------- effect parameters (documented in README) ---------------- */
  const GRAIN = { amount: 0.13, size: 2, midtoneBias: 0.6, flicker: 0.025, weave: 1.0, lift: 10 };
  const HALFTONE = { cell: 11, angles: { c: 15, m: 75, y: 0, k: 45 }, spin: 4, gain: 1.0,   // spin: deg/s added to every screen
    inks: { c: [0, 160, 224], m: [230, 0, 126], y: [255, 222, 0], k: [26, 26, 30] }, paper: [247, 242, 232] };
  const RISO = { inkA: [255, 72, 176], inkB: [0, 120, 191], paper: [243, 238, 227], dot: 2, step: 0.5, offset: 5, density: 1.0, gamma: 1.35, jitter: 0.18 };
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const CRT = { barrel: 0.08, ca: 3.0, scan: 3, scanDepth: 0.42, mask: 0.12, glow: 0.35, vignette: 0.55 };

  /* ---------------- helpers ---------------- */
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const lerp = (a, b, p) => a + (b - a) * p;
  const Ease = { outCubic: (x) => 1 - Math.pow(1 - x, 3), inOutSine: (x) => -(Math.cos(Math.PI * x) - 1) / 2, outBack: (x) => { const s = 1.70158; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); } };
  const prog = (t, a, b, e = Ease.outCubic) => e(clamp01((t - a) / (b - a)));
  // integer hash → [0,1): deterministic per (x, y, frame)
  function h3(x, y, z) { let n = (x * 374761393 + y * 668265263 + z * 2147483647) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let z = s; z = Math.imul(z ^ (z >>> 15), z | 1); z ^= z + Math.imul(z ^ (z >>> 7), z | 61); return ((z ^ (z >>> 14)) >>> 0) / 4294967296; }; }
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  const out = document.getElementById('out'), og = out.getContext('2d');
  const base = mk(PW, PH), bg = base.getContext('2d', { willReadFrequently: true });
  const pan = [0, 1, 2, 3].map(() => mk(PW, PH)), pg = pan.map((c) => c.getContext('2d', { willReadFrequently: true }));
  const glowC = mk(PW / 2, PH / 2), gg = glowC.getContext('2d');
  const R = rng(20261016);
  const FLOATERS = Array.from({ length: 14 }, () => ({ x: R() * PW, y: 40 + R() * 260, r: 6 + R() * 22, v: 10 + R() * 30, ph: R() * 6.28 }));

  /* ---------------- the shared composition (one animation, four looks) ---------------- */
  function drawBase(t) {
    const g = bg, k = t / DUR;
    g.setTransform(1, 0, 0, 1, 0, 0);
    const sky = g.createLinearGradient(0, 0, 0, PH);
    sky.addColorStop(0, `hsl(${lerp(232, 250, k)},55%,${lerp(14, 20, k)}%)`); sky.addColorStop(0.55, `hsl(${lerp(330, 345, k)},60%,${lerp(40, 46, k)}%)`); sky.addColorStop(1, `hsl(${lerp(22, 30, k)},95%,${lerp(58, 62, k)}%)`);
    g.fillStyle = sky; g.fillRect(0, 0, PW, PH);
    // slow push-in on the whole composition
    const z = lerp(1, 1.08, Ease.inOutSine(k)); g.setTransform(z, 0, 0, z, PW / 2 * (1 - z), PH / 2 * (1 - z));
    // sun rising + rotating dashed rings
    const sx = 640, sy = lerp(330, 210, Ease.inOutSine(clamp01(t / 6)));
    const sun = g.createRadialGradient(sx, sy - 30, 10, sx, sy, 130); sun.addColorStop(0, '#fff6c8'); sun.addColorStop(0.55, '#ffc24a'); sun.addColorStop(1, '#ff6a3d');
    g.fillStyle = sun; g.beginPath(); g.arc(sx, sy, 120, 0, Math.PI * 2); g.fill();
    g.lineCap = 'round';
    for (let i = 0; i < 3; i++) { g.strokeStyle = `rgba(255,230,190,${0.55 - i * 0.14})`; g.lineWidth = 6 - i; g.setLineDash([18 + i * 10, 22 + i * 8]); g.lineDashOffset = -t * (40 + i * 25) * (i % 2 ? -1 : 1); g.beginPath(); g.arc(sx, sy, 150 + i * 34, 0, Math.PI * 2); g.stroke(); }
    g.setLineDash([]);
    // drifting circles
    for (const f of FLOATERS) { const x = (f.x + f.v * t) % (PW + 60) - 30, y = f.y + 10 * Math.sin(t * 1.3 + f.ph); g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.arc(x, y, f.r, 0, Math.PI * 2); g.fill(); }
    // layered waves
    const WAV = ['#ff8a5b', '#d64b6f', '#6c2a7a', '#1f1b4a'];
    WAV.forEach((c, i) => {
      const y0 = 300 + i * 45, a = 16 + i * 4, f = 0.012 - i * 0.0015, sp = 1.2 + i * 0.5;
      g.fillStyle = c; g.beginPath(); g.moveTo(-20, PH + 40);
      for (let x = -20; x <= PW + 20; x += 10) g.lineTo(x, y0 + a * Math.sin(x * f + t * sp + i) + 6 * Math.sin(x * f * 2.7 - t * 1.7));
      g.lineTo(PW + 20, PH + 40); g.closePath(); g.fill();
    });
    // title: whole Arabic word (never split), scale-in with outBack, then gentle float
    const ti = prog(t, 0.6, 1.4, Ease.outBack), fl = 4 * Math.sin(t * 1.6);
    g.save(); g.translate(250, 200 + fl); g.scale(lerp(0.6, 1, ti), lerp(0.6, 1, ti)); g.globalAlpha = clamp01((t - 0.6) / 0.25);
    g.font = '150px "TLalezar"'; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(20,10,40,0.35)'; g.fillText('ملمس', 6, 10); g.fillStyle = '#fff7ec'; g.fillText('ملمس', 0, 0);
    g.direction = 'ltr'; g.font = '700 30px "TGrotesk"'; g.letterSpacing = '10px'; g.fillStyle = '#ffe1c7'; g.fillText('TEXTURE LAB', 6, 110); g.letterSpacing = '0px';
    g.restore();
  }

  /* ---------------- 1. film grain ---------------- */
  function fxGrain(src, dst, t) {
    const f = Math.round(t * FPS), A = GRAIN.amount * 255, wx = Math.round(GRAIN.weave * Math.sin(f * 1.7)), wy = Math.round(GRAIN.weave * Math.sin(f * 2.3 + 1));
    const fl = 1 + GRAIN.flicker * (h3(f, 7, 3) * 2 - 1);
    const s = src.data, d = dst.data, gs = GRAIN.size;
    for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
      const sx = Math.min(PW - 1, Math.max(0, x + wx)), sy = Math.min(PH - 1, Math.max(0, y + wy)), i = (sy * PW + sx) * 4, o = (y * PW + x) * 4;
      const L = (0.299 * s[i] + 0.587 * s[i + 1] + 0.114 * s[i + 2]) / 255;
      const n = (h3((x / gs) | 0, (y / gs) | 0, f) + h3(x, y, f + 911) * 0.5 - 0.75) * 1.33;  // grain clumps of 2 px + fine
      const amp = A * (1 - GRAIN.midtoneBias * Math.abs(2 * L - 1));
      d[o] = (GRAIN.lift + s[i] * 0.96) * fl + n * amp;
      d[o + 1] = (GRAIN.lift * 0.8 + s[i + 1] * 0.94) * fl + n * amp;
      d[o + 2] = (GRAIN.lift * 0.6 + s[i + 2] * 0.9) * fl + n * amp * 1.05;
      d[o + 3] = 255;
    }
  }

  /* ---------------- 2. CMYK halftone with rotating screens ---------------- */
  function fxHalftone(src, ctx, t) {
    const P = HALFTONE.paper, s = src.data, c = HALFTONE.cell;
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = `rgb(${P})`; ctx.fillRect(0, 0, PW, PH);
    ctx.globalCompositeOperation = 'multiply';
    const spin = HALFTONE.spin * t;
    for (const ch of ['y', 'c', 'm', 'k']) {
      const a = ((HALFTONE.angles[ch] + spin) * Math.PI) / 180, ca = Math.cos(a), sa = Math.sin(a), I = HALFTONE.inks[ch];
      ctx.fillStyle = `rgb(${I})`; ctx.beginPath();
      const ext = Math.ceil(Math.hypot(PW, PH) / 2 / c) + 1, cx = PW / 2, cy = PH / 2;
      for (let v = -ext; v <= ext; v++) for (let u = -ext; u <= ext; u++) {
        const x = cx + (u * ca - v * sa) * c, y = cy + (u * sa + v * ca) * c;
        if (x < -c || y < -c || x > PW + c || y > PH + c) continue;
        const i = ((Math.min(PH - 1, Math.max(0, y | 0))) * PW + Math.min(PW - 1, Math.max(0, x | 0))) * 4;
        const r = s[i] / 255, gg2 = s[i + 1] / 255, b = s[i + 2] / 255, K = 1 - Math.max(r, gg2, b);
        let val = ch === 'k' ? K : K >= 0.999 ? 0 : (ch === 'c' ? 1 - r - K : ch === 'm' ? 1 - gg2 - K : 1 - b - K) / (1 - K);
        if (ch === 'k') val = Math.max(0, (val - 0.25) / 0.75);   // under-colour removal: only deep shadows get black
        const rad = c * Math.sqrt(clamp01(val * HALFTONE.gain) / Math.PI);   // dot area = ink coverage
        if (rad > 0.35) { ctx.moveTo(x + rad, y); ctx.arc(x, y, rad, 0, Math.PI * 2); }
      }
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------------- 3. two-ink risograph ---------------- */
  function fxRiso(src, dst, t) {
    const pr = Math.floor(t / RISO.step);                                  // each "print" re-registers the drum
    const ox = Math.round((h3(pr, 1, 5) * 2 - 1) * RISO.offset), oy = Math.round((h3(pr, 2, 5) * 2 - 1) * RISO.offset);
    const s = src.data, d = dst.data, P = RISO.paper, A = RISO.inkA, B = RISO.inkB, D = RISO.dot;
    for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
      const o = (y * PW + x) * 4, i = o;
      const xb = Math.min(PW - 1, Math.max(0, x - ox)), yb = Math.min(PH - 1, Math.max(0, y - oy)), j = (yb * PW + xb) * 4;
      // separation: pink ink absorbs green, blue ink absorbs red
      const da = Math.pow(clamp01((1 - s[i + 1] / 255) * RISO.density), RISO.gamma), db = Math.pow(clamp01((1 - s[j] / 255) * RISO.density), RISO.gamma);
      // screen: 4x4 ordered dither in 2 px cells + seeded jitter (grain), stable per print so the paper doesn't boil
      const ca = ((x / D) | 0), ra = ((y / D) | 0), cb = ((xb / D) | 0), rb = ((yb / D) | 0);
      const na = BAYER[(ra & 3) * 4 + (ca & 3)] + RISO.jitter * (h3(ca, ra, 17 + pr * 3) - 0.5), nb = BAYER[((rb + 2) & 3) * 4 + ((cb + 1) & 3)] + RISO.jitter * (h3(cb, rb, 91 + pr * 3) - 0.5);
      const ia = da > na ? 0.92 : da * 0.12, ib = db > nb ? 0.88 : db * 0.1;
      const paperGrain = 1 - 0.05 * h3(x, y, 3);
      for (let k = 0; k < 3; k++) d[o + k] = P[k] * paperGrain * (1 - ia * (1 - A[k] / 255)) * (1 - ib * (1 - B[k] / 255));
      d[o + 3] = 255;
    }
    return { ox, oy };
  }

  /* ---------------- 4. CRT: barrel, chromatic aberration, scanlines, mask, glow ---------------- */
  function fxCRT(src, dst, t) {
    const s = src.data, d = dst.data, f = Math.round(t * FPS), fl = 1 - 0.03 * h3(f, 9, 9);
    const roll = ((t * 0.35) % 1.2) - 0.1;                                  // rolling brighter band
    const ca = CRT.ca * (1 + 0.4 * Math.sin(t * 2.1));
    for (let y = 0; y < PH; y++) {
      const v = (y / PH) * 2 - 1;
      for (let x = 0; x < PW; x++) {
        const u = (x / PW) * 2 - 1, r2 = u * u * 0.6 + v * v, kk = 1 + CRT.barrel * r2 * 1.6;
        const su = u * kk, sv = v * kk, o = (y * PW + x) * 4;
        if (su < -1 || su > 1 || sv < -1 || sv > 1) { d[o] = d[o + 1] = d[o + 2] = 6; d[o + 3] = 255; continue; }
        const px = (su + 1) * 0.5 * (PW - 1), py = (sv + 1) * 0.5 * (PH - 1), sh = ca * (0.4 + r2);
        const row = Math.round(py) * PW;
        const ir = (row + Math.min(PW - 1, Math.max(0, Math.round(px + sh)))) * 4, ig = (row + Math.round(px)) * 4, ib = (row + Math.min(PW - 1, Math.max(0, Math.round(px - sh)))) * 4;
        const scan = 1 - CRT.scanDepth * Math.pow(Math.sin((Math.PI * y) / CRT.scan), 2);
        const m = x % 3, mr = m === 0 ? 1 : 1 - CRT.mask, mg = m === 1 ? 1 : 1 - CRT.mask, mb = m === 2 ? 1 : 1 - CRT.mask;
        const vig = 1 - CRT.vignette * Math.pow(r2 / 1.6, 1.5), band = 1 + 0.08 * Math.exp(-Math.pow((sv * 0.5 + 0.5 - roll) / 0.05, 2));
        const k2 = scan * vig * band * fl * 1.12;
        d[o] = s[ir] * mr * k2; d[o + 1] = s[ig + 1] * mg * k2; d[o + 2] = s[ib + 2] * mb * k2; d[o + 3] = 255;
      }
    }
  }

  /* ---------------- frame ---------------- */
  const LABELS = [['حبيبات الفيلم', 'FILM GRAIN'], ['نقاط الطباعة', 'CMYK HALFTONE'], ['ريزوغراف', 'RISOGRAPH · 2 INKS'], ['شاشة أنبوبية', 'CRT']];
  const POS = [[M, M], [M + PW + GUT, M], [M, M + PH + GUT], [M + PW + GUT, M + PH + GUT]];
  function chip(x, y, ar, en, info, a) {
    og.save(); og.globalAlpha = a; og.font = '600 28px "TCairo"'; og.direction = 'rtl';
    const wA = og.measureText(ar).width; og.font = '500 18px "TMono"'; og.direction = 'ltr'; const wE = og.measureText(en).width, wI = info ? og.measureText(info).width : 0;
    const w = Math.max(wA, wE, wI) + 36, h = info ? 104 : 80;
    og.fillStyle = 'rgba(10,10,14,0.72)'; og.beginPath(); og.roundRect(x - w, y, w, h, 14); og.fill();
    og.fillStyle = '#fff'; og.font = '600 28px "TCairo"'; og.direction = 'rtl'; og.textAlign = 'right'; og.textBaseline = 'alphabetic'; og.fillText(ar, x - 18, y + 38);
    og.font = '500 18px "TMono"'; og.direction = 'ltr'; og.textAlign = 'right'; og.fillStyle = '#c9c4ff'; og.fillText(en, x - 18, y + 66);
    if (info) { og.fillStyle = '#ffd59a'; og.fillText(info, x - 18, y + 92); }
    og.restore();
  }
  let glowCtx = gg;
  function render(t) {
    drawBase(t);
    const src = bg.getImageData(0, 0, PW, PH);
    const im0 = pg[0].createImageData(PW, PH); fxGrain(src, im0, t); pg[0].putImageData(im0, 0, 0);
    fxHalftone(src, pg[1], t);
    const im2 = pg[2].createImageData(PW, PH); const reg = fxRiso(src, im2, t); pg[2].putImageData(im2, 0, 0);
    const im3 = pg[3].createImageData(PW, PH); fxCRT(src, im3, t); pg[3].putImageData(im3, 0, 0);
    // CRT phosphor glow: half-res blurred copy added back
    glowCtx.filter = 'blur(5px)'; glowCtx.clearRect(0, 0, PW / 2, PH / 2); glowCtx.drawImage(pan[3], 0, 0, PW / 2, PH / 2); glowCtx.filter = 'none';
    pg[3].globalCompositeOperation = 'lighter'; pg[3].globalAlpha = CRT.glow; pg[3].drawImage(glowC, 0, 0, PW, PH); pg[3].globalAlpha = 1; pg[3].globalCompositeOperation = 'source-over';

    og.setTransform(1, 0, 0, 1, 0, 0); og.fillStyle = '#0d0c12'; og.fillRect(0, 0, W, H);
    const infos = [`grain ${GRAIN.amount} · ${GRAIN.size}px · seed f${Math.round(t * FPS)}`, `screens C${Math.round((15 + HALFTONE.spin * t) % 90)}° M${Math.round((75 + HALFTONE.spin * t) % 90)}° K${Math.round((45 + HALFTONE.spin * t) % 90)}°`, `misregister ${reg.ox >= 0 ? '+' : ''}${reg.ox}, ${reg.oy >= 0 ? '+' : ''}${reg.oy} px`, `aberration ${(CRT.ca * (1 + 0.4 * Math.sin(t * 2.1))).toFixed(1)} px · scan ${CRT.scan}px`];
    for (let i = 0; i < 4; i++) {
      const [x, y] = POS[i], p = prog(t, -0.3 + i * 0.12, 0.45 + i * 0.12);   // staggered wipe-in, 120 ms apart (already moving on frame 0)
      og.save(); og.beginPath(); og.roundRect(x, y, PW, PH, 22); og.clip();
      og.beginPath(); og.rect(x, y, PW * p, PH); og.clip();
      og.drawImage(pan[i], x, y); og.restore();
      og.strokeStyle = 'rgba(255,255,255,0.08)'; og.lineWidth = 2; og.beginPath(); og.roundRect(x, y, PW, PH, 22); og.stroke();
      chip(x + PW - 22, y + PH - 22 - 104, LABELS[i][0], LABELS[i][1], infos[i], prog(t, 0.6 + i * 0.12, 1.0 + i * 0.12));
    }
    const fo = clamp01((t - (DUR - 0.3)) / 0.3); if (fo > 0) { og.fillStyle = `rgba(0,0,0,${fo})`; og.fillRect(0, 0, W, H); }
  }

  /* ---------------- contract ---------------- */
  let T0 = 0, playing = false, last = 0;
  function seek(t) { T0 = Math.max(0, Math.min(DUR, t)); render(T0); }
  const ready = Promise.all([document.fonts.load('150px "TLalezar"', 'ملمس'), document.fonts.load('600 28px "TCairo"', 'حبيبات A'), document.fonts.load('700 30px "TGrotesk"', 'TEXTURE'), document.fonts.load('500 18px "TMono"', 'CRT 0')])
    .then(() => document.fonts.ready).then(() => { seek(parseFloat(new URLSearchParams(location.search).get('t') || '0') || 0); return true; });
  window.__kosif = { duration: DUR, fps: FPS, seek };
  window.__kosifReady = ready;
  if (navigator.webdriver) document.body.classList.add('render');
  function fit() { const k = Math.min(innerWidth / W, innerHeight / H); document.getElementById('fit').style.transform = `scale(${k})`; }
  addEventListener('resize', fit); fit();
  function loop(now) { if (!playing) return; const dt = (now - last) / 1000; last = now; let t = T0 + dt; if (t >= DUR) t = 0; seek(t); requestAnimationFrame(loop); }
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playing = !playing; last = performance.now(); if (playing) requestAnimationFrame(loop); }
    if (e.code === 'ArrowRight') seek(T0 + 1 / FPS);
    if (e.code === 'ArrowLeft') seek(T0 - 1 / FPS);
  });
})();
</script>
</body>
</html>

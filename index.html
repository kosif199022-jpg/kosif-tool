<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOSIF TOOL — أطلس الموشن جرافيك</title>
<meta name="description" content="أطلس استايلات الموشن جرافيك لكلاود: 288 استايلًا مع ملفات إبداعية ودلائل تنفيذ ومولّد طلبات جاهزة لـ Claude Code. Motion graphics style atlas for Claude Code with briefs, playbooks and a request generator.">
<meta name="theme-color" content="#070b14">
<meta property="og:title" content="KOSIF TOOL — Motion Graphics Atlas for Claude Code">
<meta property="og:description" content="288 motion styles, original briefs, production playbooks and a ready-to-paste Claude Code request generator. Arabic and English.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kosif199022-jpg.github.io/kosif-tool/">
<link rel="icon" href="web/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="web/app.css">
<script>
  // Apply saved theme/language before paint to avoid flashes.
  (function () {
    try {
      var th = localStorage.getItem('kosif.theme');
      if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
      var lg = localStorage.getItem('kosif.lang');
      if (lg === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="#/"><span class="logo">K</span><span>KOSIF TOOL<small data-i18n="hero.kicker">أطلس استايلات مفتوح لكلاود</small></span></a>
    <nav class="main" id="nav">
      <a href="#/" data-route="library" data-i18n="nav.library">المكتبة</a>
      <a href="#/generator" data-route="generator" data-i18n="nav.generator">مولّد الطلب</a>
      <a href="#/playbooks" data-route="playbooks" data-i18n="nav.playbooks">الدلائل</a>
      <a href="#/guide" data-route="guide" data-i18n="nav.guide">كيف أستخدمه</a>
      <a href="#/favorites" data-route="favorites" data-i18n="nav.favorites">المفضلة</a>
      <a href="https://github.com/kosif199022-jpg/kosif-tool" target="_blank" rel="noopener noreferrer" data-i18n="nav.github">GitHub</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="langToggle" data-i18n="lang.toggle">English</button>
      <button class="icon-btn" id="themeToggle" data-i18n-title="theme.toggle" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</header>
<main id="view" aria-live="polite">
  <div class="skeleton" aria-hidden="true"></div>
</main>
<footer class="site-footer">
  <div class="inner">
    <span data-i18n="footer.text"></span>
    <span><a href="https://www.promptsmotion.com/terms" target="_blank" rel="noopener noreferrer" data-i18n="footer.terms">شروط المصدر</a> · <a href="https://github.com/kosif199022-jpg/kosif-tool" target="_blank" rel="noopener noreferrer">kosif199022-jpg/kosif-tool</a></span>
  </div>
</footer>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="web/app.js"></script>
</body>
</html>

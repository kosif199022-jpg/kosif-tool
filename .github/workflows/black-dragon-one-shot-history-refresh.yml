name: Black Dragon one-shot history index repair
on:
  push:
    branches:
      - feat/black-dragon-creative-council-20261106
    paths:
      - .github/workflows/black-dragon-one-shot-history-refresh.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/black-dragon-creative-council-20261106
      - name: Verify record schema and generate task history indexes
        run: |
          python3 .claude/skills/kosif-superpowers/scripts/task_history.py validate || python3 .claude/skills/kosif-superpowers/scripts/task_history.py check
          python3 .claude/skills/kosif-superpowers/scripts/task_history.py build
          python3 .claude/skills/kosif-superpowers/scripts/task_history.py build --check
          git diff --check
      - name: Commit regenerated index and self-remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/black-dragon-one-shot-history-refresh.yml
          git add .github/workflows/black-dragon-one-shot-history-refresh.yml
          git add history/INDEX.md history/index.json
          git diff --cached --check
          git commit -m "fix: refresh task history index after schema normalization"
          git push origin HEAD:refs/heads/feat/black-dragon-creative-council-20261106

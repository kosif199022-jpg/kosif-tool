name: KOSIF Temporary Creative Catalog Build
on:
  push:
    branches:
      - feat/drawing-academy-20261022
permissions:
  contents: write
jobs:
  build-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/drawing-academy-20261022
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate local deterministic tool catalog
        run: |
          python3 .claude/skills/kosif-superpowers/scripts/hub.py build
          git status --short
      - name: Push only generated files to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/kosif-superpowers/manifest.json
          git add .claude/skills/kosif-superpowers/references/INDEX.md
          git add .claude/skills/kosif-superpowers/SKILL.md
          git add .claude/skills/kosif-superpowers/references/guides/draw.md
          git add .claude/skills/kosif-superpowers/references/guides/motion.md
          if git diff --cached --quiet; then
            echo "Generated artifacts already current"
          else
            git commit -m "build: synchronize four creative tool registry entries"
            git push origin HEAD:feat/drawing-academy-20261022
          fi

name: Refresh Black Dragon generated graph for PR205
on:
  push:
    branches:
      - feature/black-dragon-unified-activation-20261101
    paths:
      - '.github/workflows/black-dragon-pr205-refresh-generated.yml'
permissions:
  contents: write
jobs:
  refresh-graph:
    if: github.repository == 'kosif199022-jpg/kosif-tool'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate only capability graph outputs
        working-directory: .claude/skills/kosif-superpowers
        run: python3 scripts/capability_graph.py build
      - name: Commit refreshed graph only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/skills/kosif-superpowers/data/capability_graph.json .claude/skills/kosif-superpowers/references/capability-graph.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(black-dragon): regenerate capability graph for activation"
            git push origin HEAD:refs/heads/feature/black-dragon-unified-activation-20261101
          fi

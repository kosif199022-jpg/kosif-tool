name: Repair SEE Fusion Catalog and Generated Files
on:
  push:
    branches: ['feature/see-superpowers-unified-fusion-20261030']
    paths: ['.github/workflows/see-fusion-repair-once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/see-superpowers-unified-fusion-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register both SEE adapters and maintain one skill layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('.claude/skills/kosif-superpowers')
          p = root / 'data/tools.json'
          registry = json.loads(p.read_text(encoding='utf-8'))
          names = {t['id'] for t in registry['tools']}
          def record(name, path, en, ar, summary, example, test, guide, kws, situations):
              return {
                  'id': name,
                  'title_en': en, 'title_ar': ar,
                  'summary_en': summary,
                  'summary_ar': 'توجيه القدرات وأساليب التفكير بصورة للقراءة فقط مع حفظ حدود التنفيذ والتحقق.',
                  'root': 'skill', 'path': path, 'kind': 'cli', 'area': 'think',
                  'use_when': situations,
                  'keywords': kws,
                  'commands': [{'name':'route', 'example':example,
                               'does':'Return a read-only SEE method routing record without executing agents.'}],
                  'inputs':'A user task description and optional mode.',
                  'outputs':'A JSON plan, named method candidates and explicit execution limitations.',
                  'requires': {'python':[], 'binaries':['python3'], 'node':[],
                               'optional':[], 'network':False},
                  'safety':'read-only', 'consent':'',
                  'limits':'This chooses guidance only; no proprietary source, hosted Full Pro, execution or verified output.',
                  'evidence':'tested-here',
                  'evidence_note':'Deterministic offline routing and claim-boundary regression tests only.',
                  'tests':[f'.claude/skills/kosif-superpowers/evals/{test}'],
                  'docs':[f'.claude/skills/kosif-superpowers/{guide}'],
                  'families':[], 'safe_commands':[]
              }
          items = [
              record('see-capability-bridge','scripts/see_capability_bridge.py',
                     'SEE capability routing bridge','جسر توجيه قدرات SEE',
                     'Map the 11 cognitive lenses and nine SEE domains to specialist routes and live owners.',
                     'python3 scripts/see_capability_bridge.py --task "reconcile an Excel bank statement" --mode deep',
                     'test_see_capability_bridge.py','references/see-capability-bridge-20261030.md',
                     ['see','capability','route','thinking','cognition','specialists','full pro','decision'],
                     ['Route specialist SEE methods for a finance task without running an external service',
                      'Distinguish Full Pro or remote tool availability from execution and proof']),
              record('see-superpower-unifier','scripts/see_superpower_unifier.py',
                     'SEE and Superpowers unified planning','توحيد تخطيط SEE وسوبر باور',
                     'Enrich the one canonical Superpowers hub with bounded SEE cognitive and capability planning.',
                     'python3 scripts/see_superpower_unifier.py plan "review bank invoices" --mode deep',
                     'test_see_superpower_unifier.py','references/protocol/A12-see-pro-cognitive-fusion.md',
                     ['see','superpowers','fusion','unified','thinking','route','planning','11 lenses'],
                     ['Fuse SEE method candidates with the canonical Superpowers hub tool and power IDs',
                      'Create a permission-conscious plan and validation chain without a duplicate registry'])
          ]
          for row in items:
              if row['id'] not in names:
                  registry['tools'].append(row)
          p.write_text(json.dumps(registry,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          layout_file=root/'data/skill_layout.json'
          layout=json.loads(layout_file.read_text(encoding='utf-8'))
          cognition=next(s for s in layout['sections'] if s['id']=='cognition')
          doc='references/see-capability-bridge-20261030.md'
          if doc not in cognition['files']:
              cognition['files'].append(doc)
          layout_file.write_text(json.dumps(layout,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          print('Registered adapters:',[r['id'] for r in registry['tools'] if r['id'].startswith('see-')])
          PY
      - name: Rebuild native Superpowers generated files
        shell: bash
        run: |
          cd .claude/skills/kosif-superpowers
          python3 scripts/hub.py build
          python3 scripts/skill_layout.py build
          python3 scripts/build_chapters.py
          python3 scripts/see_superpower_unifier.py self-test
          python3 -m unittest discover -s evals -p test_see_superpower_unifier.py -v
          python3 scripts/check_skill.py --evals
      - name: Commit regenerated files back to the feature branch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .claude/skills/kosif-superpowers
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'fix(superpowers): register SEE adapters and rebuild skill indexes'
            git push origin HEAD:feature/see-superpowers-unified-fusion-20261030
          fi

# Retry after completing A12 contents validation.

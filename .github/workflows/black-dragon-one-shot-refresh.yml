name: Black Dragon one-shot generated index refresh
on:
  push:
    branches:
      - feat/black-dragon-creative-council-20261106
    paths:
      - .github/workflows/black-dragon-one-shot-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/black-dragon-creative-council-20261106
          persist-credentials: true
      - name: Rebuild and verify deterministic smart-capability index
        run: |
          python3 .claude/skills/kosif-superpowers/scripts/smart_capabilities.py build
          python3 .claude/skills/kosif-superpowers/scripts/smart_capabilities.py verify
          git diff --check
      - name: Commit regenerated index and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/black-dragon-one-shot-refresh.yml
          git add .github/workflows/black-dragon-one-shot-refresh.yml
          git add .claude/skills/kosif-superpowers/data/smart_capability_index.json
          git add .claude/skills/kosif-superpowers/references/SMART_CAPABILITY_GROUPS.md
          git add .claude/skills/kosif-superpowers/references/CLAUDE_3_MINUTE_MAP.md
          git diff --cached --check
          git commit -m "fix: refresh generated smart index against latest tool manifest"
          git push origin HEAD:refs/heads/feat/black-dragon-creative-council-20261106

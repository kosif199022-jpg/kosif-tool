name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalog and files
        run: python3 tools/validate.py
      - name: Derived files are up to date
        run: python3 tools/build.py --check
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: KOSIF Superpowers integrity + routing evaluations
        run: python3 .claude/skills/kosif-superpowers/scripts/check_skill.py --evals
      - name: REA bridge and router safety regression tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_rea_*.py' -v
      - name: Community source scout and safety regression tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_source_scout.py' -v
      - name: Capacity and Python readiness regression tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_system_python.py' -v
      - name: Test executable motion runtime and 25-engine registry
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_motion_runtime.py' -v
      - name: Test 12 deterministic motion primitives
        run: node --test .claude/skills/kosif-superpowers/evals/test_motion_toolkit.mjs
      - name: Node tests (generator, markdown)
        run: node --test tests/*.mjs
      - name: Syntax-check site modules
        run: for f in web/*.js; do node --check "$f"; done

      - name: Build installable Claude Superpowers skill
        run: python3 .claude/skills/kosif-superpowers/scripts/package_skill.py --lite -o ./dist/kosif-superpowers.skill
      - name: Upload Claude installable skill
        uses: actions/upload-artifact@v4
        with:
          name: kosif-superpowers-installable
          path: dist/kosif-superpowers.skill
          retention-days: 14
          if-no-files-found: error

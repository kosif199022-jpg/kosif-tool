name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalog and files
        run: python3 tools/validate.py
      - name: Derived files are up to date
        run: python3 tools/build.py --check
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: KOSIF Superpowers integrity + routing evaluations
        run: python3 .claude/skills/kosif-superpowers/scripts/check_skill.py --evals
      - name: Skill layout map (USIP v5.4)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_skill_layout.py' -v
      - name: Prompt lab, GitHub top-1000 tracker, repo map, memory ops and motion physics
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_prompt_lab.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_github_top_repos.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_repo_map.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_memory_ops.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_motion_physics.py' -v
      - name: Permission-aware capability routing and honest host discovery
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_capability_runtime_router.py' -v
      - name: Creative audio-to-motion reasoning tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_creative_intelligence.py' -v
      - name: Safe repository capability transfer tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_repository_capability_packer.py' -v
      - name: Differential hidden-exam scorer tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_differential_exam.py' -v
      - name: REA bridge and router safety regression tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_rea_*.py' -v
      - name: Mosamem x REA fusion bridge tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_mosamem_rea_fusion.py' -v
      - name: Smart capability index is up to date
        run: python3 .claude/skills/kosif-superpowers/scripts/smart_capabilities.py verify
      - name: Community source scout and safety regression tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_source_scout.py' -v
      - name: Capacity and Python readiness regression tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_system_python.py' -v
      - name: Evidence-backed creative quality and timeline logic gates
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_creative_quality_gate.py' -v
      - name: Measured music hypotheses and audio-reactive visuals tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_music_rhythm_engine.py' -v
      - name: Style atlas 86 + explainer engine (static; browser tests skip without Playwright)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_*atlas_*.py' -v
      - name: Style library (586 styles, swatches, catalog)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_style_library.py' -v
      - name: Business workflows (A16)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_business_workflows.py' -v
      - name: Book-distilled methods (A20)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_book_methods.py' -v
      - name: Reference visual observation and color-to-edit integration tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_reference_visual*.py' -v
      - name: Reference Edit Engine Python and project generation tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_reference_edit_engine.py' -v
      - name: Motion Lab execution and safety regression tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_motion_*.py' -v
      - name: Motion engine JavaScript execution contract
        run: node --test .claude/skills/kosif-superpowers/evals/test_motion_engine.mjs
      - name: Motion engine JavaScript syntax
        run: node --check .claude/skills/kosif-superpowers/assets/motion_engine.js
      - name: Portable KOSIF motion toolkit and SVG seek tests
        run: node --test .claude/skills/kosif-superpowers/evals/test_motion_toolkit.mjs .claude/skills/kosif-superpowers/evals/test_motion_template.mjs
      - name: Install image, typography atlas and photo-pipeline dependencies
        run: python3 -m pip install --disable-pip-version-check 'Pillow==12.3.0' 'fonttools[woff]==4.60.1' 'beautifulsoup4==4.15.0' 'opencv-python-headless==4.12.0.88'
      - name: KOSIF Creative Paint PNG/SVG/GIF/MP4 functionality and safety
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_creative_paint.py' -v
      - name: KOSIF portrait pipeline (stroke-built graphite portrait, method cards, review gate)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_portrait_pipeline.py' -v
      - name: IK character motion and immutable AAC audio packet tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_character_ik.py' -v
      - name: Verify original Blender five-second movie
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_blender_cat_rescue_demo.py' -v
      - name: Full body face and AAC packet-copy tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_character_fullbody.py' -v
      - name: Drawing-book methods atlas, layered construction SVGs and geometry checks
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_drawing_methods.py' -v
      - name: Drawing council tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_drawing_council.py' -v
      - name: Verify offline Claude bootstrap and every catalog link
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_local_first.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_catalog_evidence_audit.py' -v
      - name: Verify Blender-free native 3D frame and H264 rendering
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_native_3d.py' -v
      - name: Verify independent Smart Draw and Blender AST audit
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_smart_draw.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_local_project_audit.py' -v
      - name: Verify browser URL policy and 26 public source targets
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_browser_scout.py' -v
      - name: Validate external Atlas metadata audit behavior
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_atlas_metadata_audit.py' -v
      - name: Skill intelligence protocol
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_skill_intelligence.py' -v
      - name: USIP v5.3 protocol structure, routing quality, FusionForge v2 and shadow evals
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_protocol_structure.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_routing_quality.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_fusionforge.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_usip_shadow.py' -v
      - name: Superpower fusion, groups and mind map
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_superpower_fusion.py' -v
      - name: Groups index
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_kosif_hubs.py' -v
      - name: Capability mind map
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_capability_mindmap.py' -v
      - name: Atlas capability miner
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_atlas_capability_miner.py' -v
      - name: Charter 500-expert index (council consults it as an index)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_charter_index.py' -v
      - name: Pro council with the 100-persona roster (A13, A30)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_council.py' -v
      - name: Family tools (decision math, particles, geo, prompts, diagrams, UI beats, stats, TTS, brand tokens, agent guard)
        run: for t in decision_math particles geo_plate prompt_forge diagram_layout ui_beat stats_lab tts_script brand_tokens agent_guard; do python3 .claude/skills/kosif-superpowers/evals/test_$t.py -v || exit 1; done
      - name: Story question pack (A16)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_story_pack.py' -v
      - name: Prompt pack (warn-only lint, one code block per prompt)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_prompt_pack.py' -v
      - name: Sources index (secrets by location only)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_sources_index.py' -v
      - name: Local image AI (synthetic ONNX graphs; skips without onnxruntime)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_image_local_ai.py' -v
      - name: Montage Pro
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_montage_pro.py' -v
      - name: Reel factory (rights record, plan math; the render smoke test skips without ffmpeg/Chromium)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_reel_factory.py' -v
      - name: Wednesday dua reel engine (render part skips without OpenCV and Playwright)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_dua_wednesday.py' -v
      - name: Stream grabber
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_stream_grabber.py' -v
      - name: Caption lines (reading rules, suspect-phrase screen, SRT/VTT/JSON)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_caption_lines.py' -v
      - name: Look pipeline (one colour look; ffmpeg parity part skips without ffmpeg)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_look_pipeline.py' -v
      - name: Web app study guardrails and facts-only report (live browser part skips without REA)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_web_app_study.py' -v
      - name: Verify Blender-free native Z-buffer rasterizer
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_native_zbuffer.py' -v
      - name: Verify independent cone and torus rendering
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_native_primitives.py' -v
      - name: KOSIF Code Drawing Master Python scene/actor tests
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_code_drawing_master.py' -v
      - name: KOSIF Code Drawing Master SVG and morph runtime tests
        run: node --test .claude/skills/kosif-superpowers/evals/test_code_drawing_engine.mjs
      - name: Every skill eval suite (catch-all, so a new test file is never missed)
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_*.py'
      - name: Tests kept beside their tools (they back tested-here registry claims)
        run: |
          python3 .claude/skills/kosif-superpowers/proofs/general-writing/test_writing.py
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/scripts -p 'test_*.py' -v
      - name: Front door, tool registry and catalog MCP server
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_hub.py' -v
          python3 .claude/skills/kosif-superpowers/scripts/kosif_mcp.py --selftest
          python3 .claude/skills/kosif-superpowers/scripts/owned_repos.py --self-test
          python3 .claude/skills/kosif-superpowers/scripts/owned_repos.py verify
      - name: Generated skill files are current (every builder is deterministic)
        run: |
          python3 .claude/skills/kosif-superpowers/scripts/requirements.py derive --check
          python3 .claude/skills/kosif-superpowers/scripts/relabel_proofs.py --check
          python3 .claude/skills/kosif-superpowers/scripts/build_chapters.py --check
          python3 .claude/skills/kosif-superpowers/scripts/requirements.py index --check
          python3 .claude/skills/kosif-superpowers/scripts/capability_graph.py build --check
          python3 .claude/skills/kosif-superpowers/scripts/capability_atlas.py build --check
          (cd .claude/skills/kosif-superpowers && python3 scripts/powers.py mindmap --html references/capability-map.html --update-md references/capability-map.md --check)
          python3 .claude/skills/kosif-superpowers/scripts/hub.py build --check
          python3 .claude/skills/kosif-superpowers/scripts/boot.py --static --check
      - name: Node tests (generator, markdown)
        run: node --test tests/*.mjs
      - name: Syntax-check site modules
        run: for f in web/*.js; do node --check "$f"; done

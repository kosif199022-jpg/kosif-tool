name: Black Dragon checks
on:
  pull_request:
    paths:
      - '.github/workflows/black-dragon-regenerate.yml'
      - 'starters/remotion/**'
      - '.claude/skills/kosif-superpowers/scripts/blender_rescue_scene.py'
      - '.claude/skills/kosif-superpowers/scripts/blender_cat_fur_upgrade.py'
      - '.claude/skills/kosif-superpowers/scripts/test_blender_cat_fur_upgrade.py'
      - '.claude/skills/kosif-superpowers/data/tools.json'
      - '.claude/skills/kosif-superpowers/data/black_dragon_adapters.json'
      - '.claude/skills/kosif-superpowers/scripts/black_dragon.py'
      - '.claude/skills/kosif-superpowers/scripts/_black_dragon_*.py'
      - 'tests/test_black_dragon*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.13: the bpy wheel (Blender as a Python module) is built only for Blender's own CPython.
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prerequisites for the media, skill and tool adapters (ffmpeg, fonts, Python packages, Playwright Chromium)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fontconfig fonts-noto-core imagemagick \
            libx11-6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libxext6 libsm6 libice6 libgl1 libegl1
          python3 -m pip install -q numpy openpyxl pillow opencv-python-headless \
            'fonttools[woff]' brotli scipy matplotlib shapely segno python-pptx beautifulsoup4 \
            imageio-ffmpeg arabic-reshaper python-bidi instaloader mcp yt-dlp pyyaml
          # Blender 5.2 as a Python module, so the blender-rescue-scene / blender-cat-fur-upgrade tests run without the app.
          python3 -m pip install -q 'bpy==5.2.*'
          python3 -c "import bpy; print('bpy', bpy.app.version_string)"
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          # Some suites run the renderer from a temp folder, so tell it where Playwright lives.
          echo "KOSIF_PLAYWRIGHT=$GITHUB_WORKSPACE/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Remotion starter dependencies (exact lockfile; node_modules stays out of git)
        working-directory: starters/remotion
        run: npm ci --no-audit --no-fund
      - name: Black Dragon unit and integration tests
        run: python3 -m unittest discover -s tests -p 'test_black_dragon*.py' -v
      - name: Generated indexes are current (regenerate locally with the chain in references/guides/maintain.md)
        working-directory: .claude/skills/kosif-superpowers
        run: |
          python3 scripts/hub.py build --check
          python3 scripts/capability_graph.py build --check
          python3 scripts/boot.py --static --check
          python3 scripts/check_skill.py
      - name: Real run with reviewed adapters and tool probes (evidence uploaded)
        run: |
          set +e
          python3 .claude/skills/kosif-superpowers/scripts/black_dragon.py run "اعمل مونتاج فيديو موشن جرافيك بصوت" \
            --job out/black-dragon/ci-run --workers 4 --probe-tools --reviewed-adapters --execute-adapters --timeout 1200 \
            --validate-cards
          code=$?
          set -e
          # 0 = every reviewed adapter executed (catalog entries without an adapter stay blocked,
          # see full_coverage in the report); 4 = reviewed execution incomplete; anything else is an error
          # name every failed adapter with its ledger record, so a red run says what broke
          python3 -c 'import json; items = json.load(open("out/black-dragon/ci-run/all_skills_ledger.json"))["items"]; [print("FAILED", k, json.dumps(v, ensure_ascii=False)[:1500]) for k, v in items.items() if v.get("status") == "failed"]' || true
          test "$code" -eq 0
          python3 - <<'PY'
          import json
          r = json.load(open("out/black-dragon/ci-run/black_dragon_report.json"))
          assert r["assignment_complete"] and r["assigned"] == r["scheduled"], r
          assert r["failed"] == 0 and r["executed"] == r["adapter_count"], r
          assert sum(r["blocked_why"].values()) == r["blocked"], r["blocked_why"]
          assert r["reviewed_execution_complete"] and not r["full_coverage"], r
          # structural card validation is a separate tier: every card has one receipt, none counts as executed
          assert r["validated"] + r["validation_invalid"] == r["scheduled"], r["validation"]
          assert r["validation"]["counts_as_executed"] is False, r["validation"]
          lines = open("out/black-dragon/ci-run/validation.jsonl", encoding="utf-8").read().splitlines()
          assert len(lines) == r["scheduled"], len(lines)
          print("assigned", r["assigned"], "executed", r["executed"], "probe_passed", r["probe_passed"],
                "blocked_why", r["blocked_why"], "validated", r["validated"], "invalid", r["validation_invalid"])
          PY
          # re-hash the validation receipts and every validated source (no scripts run)
          python3 .claude/skills/kosif-superpowers/scripts/black_dragon.py verify --job out/black-dragon/ci-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: black-dragon-ci-run
          path: |
            out/black-dragon/ci-run/*.json
            out/black-dragon/ci-run/*.md
            out/black-dragon/ci-run/validation.jsonl
            out/black-dragon/ci-run/receipts/
            out/black-dragon/ci-run/artifacts/
          if-no-files-found: warn

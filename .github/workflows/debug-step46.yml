name: debug-step46
on:
  push:
    branches: [claude/ci-debug-step46]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m pip install --disable-pip-version-check 'Pillow==12.3.0' 'fonttools[woff]==4.60.1' 'beautifulsoup4==4.15.0' 'opencv-python-headless==4.12.0.88'
      - name: Step 46 with failure annotations
        shell: bash
        run: |
          set +e
          python3 .claude/skills/kosif-superpowers/proofs/general-writing/test_writing.py > w.log 2>&1; echo "test_writing rc=$?"
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/scripts -p 'test_*.py' -v > s.log 2>&1; echo "scripts rc=$?"
          python3 - <<'PY'
          import re
          def esc(s): return s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          w = open("w.log", encoding="utf-8", errors="replace").read()
          bad = [l for l in w.splitlines() if l.startswith("FAIL")]
          if bad: print("::error title=test_writing::" + esc("\n".join(bad)[:3500]))
          s = open("s.log", encoding="utf-8", errors="replace").read()
          for b in re.split(r"\n={60,}\n", s):
              if b.startswith(("FAIL:", "ERROR:")):
                  print("::error title=scripts-tests::" + esc(b[:3500]))
          print("::warning title=scripts-tail::" + esc(s[-1200:]))
          PY

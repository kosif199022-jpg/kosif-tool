name: Refresh skill linkage capability graph once
on:
  push:
    branches:
      - feature/black-dragon-skill-capability-link-audit-20261102
    paths:
      - '.github/workflows/black-dragon-linkgraph-refresh-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'kosif199022-jpg/kosif-tool'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/black-dragon-skill-capability-link-audit-20261102
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate graph after new Black Dragon script
        working-directory: .claude/skills/kosif-superpowers
        run: |
          python3 scripts/hub.py build
          python3 scripts/capability_graph.py build
          python3 scripts/boot.py --static --write
          python3 scripts/check_skill.py
      - name: Commit generated indexes into same feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/skills/kosif-superpowers
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh capability graph after skill-link audit"
            git push origin HEAD:feature/black-dragon-skill-capability-link-audit-20261102
          fi

name: Black Dragon one-shot skills loader refresh
on:
  push:
    branches:
      - feat/black-dragon-creative-council-20261106
    paths:
      - .github/workflows/black-dragon-one-shot-loader.yml
permissions:
  contents: write
jobs:
  refresh-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/black-dragon-creative-council-20261106
      - name: Rebuild skill loader and verify source map
        run: |
          python3 .claude/skills/kosif-superpowers/scripts/skill_loader.py build
          python3 .claude/skills/kosif-superpowers/scripts/skill_loader.py build --check
          git diff --check
      - name: Commit deterministic loader and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/black-dragon-one-shot-loader.yml
          git add .github/workflows/black-dragon-one-shot-loader.yml
          git add .claude/skills/kosif-superpowers/LOADER.md
          git diff --cached --check
          git commit -m "fix: refresh skill loader after integrating Dragon Mind and Kahneman council"
          git push origin HEAD:refs/heads/feat/black-dragon-creative-council-20261106

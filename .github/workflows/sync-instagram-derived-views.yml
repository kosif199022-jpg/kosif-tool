name: Sync all Superpowers derived views (temporary)
on:
  push:
    branches:
      - feat/instagram-discovery-matrices-20261024
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild derived capability views from updated catalog
        run: |
          S=.claude/skills/kosif-superpowers/scripts
          python3 "$S/smart_capabilities.py" cards
          python3 "$S/smart_capabilities.py" library
          python3 "$S/capability_atlas.py" build
          python3 "$S/capability_graph.py" build
          python3 "$S/boot.py" --static --write
      - name: Commit canonical regenerated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh capability atlas graph library and boot documents'
            git push origin HEAD:feat/instagram-discovery-matrices-20261024
          fi

name: Cinema capability graph regeneration
on:
  push:
    branches:
      - feat/youtube-opt-in-cobalt-gateway-20261030
    paths:
      - .github/workflows/cinema-capability-graph-regen.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministically regenerate graph
        run: |
          cd .claude/skills/kosif-superpowers
          python3 scripts/capability_graph.py build
          python3 scripts/capability_graph.py build --check
      - name: Commit only the two generated graph artifacts to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .claude/skills/kosif-superpowers/data/capability_graph.json .claude/skills/kosif-superpowers/references/capability-graph.html
          if git diff --cached --quiet; then
            echo 'Graph already current'
          else
            git commit -m "build(capabilities): regenerate graph after Cinema intake changes"
            git push origin HEAD:feat/youtube-opt-in-cobalt-gateway-20261030
          fi

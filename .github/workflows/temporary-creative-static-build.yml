name: KOSIF Temporary Creative Static Build
on:
  push:
    branches:
      - feat/drawing-academy-20261022
permissions:
  contents: write
jobs:
  static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/drawing-academy-20261022
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate deterministic repository front doors
        run: |
          python3 .claude/skills/kosif-superpowers/scripts/boot.py --static --write
      - name: Commit only the two generated front doors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CAPABILITIES.md llms.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh two public capability summaries after creative atlas routing"
            git push origin HEAD:feat/drawing-academy-20261022
          fi

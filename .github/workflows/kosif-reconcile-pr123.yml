name: Temporary PR123 merge reconciliation
on:
  push:
    branches:
      - claude/project-thread-pzgz3y
    paths:
      - .github/workflows/kosif-reconcile-pr123.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile latest main with Atlas feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git checkout origin/main -- .claude/skills/kosif-superpowers/scripts/color_media.py
      - name: Rebuild all generated KOSIF catalog artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd .claude/skills/kosif-superpowers
          python3 scripts/hub.py build
          python3 scripts/requirements.py derive
          python3 scripts/relabel_proofs.py
          python3 scripts/build_chapters.py
          python3 scripts/requirements.py index
          python3 scripts/capability_graph.py build
          python3 scripts/capability_atlas.py build
          python3 scripts/powers.py mindmap --html references/capability-map.html
          python3 scripts/powers.py mindmap --update-md references/capability-map.md
          python3 scripts/smart_capabilities.py build
          python3 scripts/superpower_fusion.py build
          python3 scripts/kosif_hubs.py build
          python3 scripts/capability_mindmap.py build
          python3 scripts/owned_repos.py render
          python3 scripts/smart_capabilities.py library
          python3 scripts/smart_capabilities.py cards
          python3 scripts/superpower_fusion.py build
          python3 scripts/kosif_hubs.py build
          python3 scripts/capability_mindmap.py build
          python3 scripts/owned_repos.py render
          python3 scripts/github_top_repos.py build
          python3 scripts/micro_index.py build
          python3 scripts/hub.py build
          python3 scripts/boot.py --static --write
          python3 scripts/check_skill.py --evals
          cd ../../..
          python3 tools/build.py
          python3 tools/validate.py
          python3 -m unittest discover -s tests
      - name: Commit resolved merge and regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix(integration): reconcile PR123 Atlas and PR124 color media; rebuild indexes'
          fi
          git push origin HEAD:refs/heads/claude/project-thread-pzgz3y

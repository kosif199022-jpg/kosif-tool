name: Package KOSIF Superpowers for Claude
on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/kosif-superpowers/**'
      - '.github/workflows/skill-package.yml'
  pull_request:
    paths:
      - '.claude/skills/kosif-superpowers/**'
      - '.github/workflows/skill-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full skill catalog and routing
        run: python3 .claude/skills/kosif-superpowers/scripts/check_skill.py --evals
      - name: Verify original executable Motion Lab
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_motion_*.py' -v
          node --test .claude/skills/kosif-superpowers/evals/test_motion_engine.mjs
      - name: Install Creative Paint image dependency
        run: python3 -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Test Creative Paint image and video exports before packaging
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_creative_paint.py' -v
      - name: Test deterministic IK character motion and packet-preserved audio
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_character_ik.py' -v
      - name: Test full body movement and export before packaging
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_character_fullbody.py' -v
      - name: Verify original five-second Blender scene evidence
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_blender_cat_rescue_demo.py' -v
      - name: Test offline Claude startup and catalog evidence audit before packaging
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_local_first.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_catalog_evidence_audit.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_blender_bridge.py' -v
      - name: Verify native 3D without Blender before packaging
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_native_3d.py' -v
      - name: Verify independent Smart Draw and Blender AST audit
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_smart_draw.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_local_project_audit.py' -v
      - name: Test new Code Drawing Master before packaging
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_code_drawing_master.py' -v
          node --test .claude/skills/kosif-superpowers/evals/test_code_drawing_engine.mjs
      - name: Verify creative audio and safe repository transfer tools
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_creative_intelligence.py' -v
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_repository_capability_packer.py' -v
      - name: Test source cut transfer and executable Remotion project generator
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_reference_edit_engine.py' -v
      - name: Test audio rhythm hypotheses and frame-reactive motion
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_music_rhythm_engine.py' -v
      - name: Test creative quality and evidence gate
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_creative_quality_gate.py' -v
      - name: Test task-first runtime capability router
        run: |
          python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_capability_runtime_router.py' -v
          python3 .claude/skills/kosif-superpowers/scripts/capability_runtime_router.py --task 'كاتانا مونتاج فيديو' --json
      - name: Test measured reference visual fingerprints and Remotion color integration
        run: python3 -m unittest discover -s .claude/skills/kosif-superpowers/evals -p 'test_reference_visual*.py' -v
      - name: Package portable Claude skill
        run: python3 .claude/skills/kosif-superpowers/scripts/package_skill.py --out dist/kosif-superpowers.skill --lite --with-evals
      - name: Verify distributable contains executable capabilities
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path("dist/kosif-superpowers.skill")
          assert path.is_file() and path.stat().st_size > 1000
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              required = [
                  "SKILL.md",
                  "scripts/capability_runtime_router.py",
                  "data/capability_routes.json",
                  "references/capability-operating-manual.md",
                  "evals/test_capability_runtime_router.py",
                  "scripts/motion_director.py",
                  "scripts/code_drawing_master.py",
                  "scripts/creative_paint.py",
                  "scripts/local_first.py",
                  "scripts/catalog_evidence_audit.py",
                  "scripts/native_3d.py",
                  "templates/native-3d-demo.json",
                  "evals/test_native_3d.py",
                  "references/native-3d-runtime.md",
                  "references/blender-public-api-research.md",
                  "examples/blender_cat_rescue_5s.py",
                  "evals/test_blender_cat_rescue_demo.py",
                  "scripts/blender_api_audit.py",
                  "scripts/smart_draw.py",
                  "scripts/local_project_audit.py",
                  "templates/smart-draw-demo.json",
                  "references/blender-smartdraw-research-20261019.md",
                  "evals/test_smart_draw.py",
                  "evals/test_local_project_audit.py",
                  "scripts/blender_bridge.py",
                  "scripts/blender_worker.py",
                  "templates/blender-demo.json",
                  "references/blender-integration.md",
                  "evals/test_blender_bridge.py",
                  "evals/test_local_first.py",
                  "evals/test_catalog_evidence_audit.py",
                  "references/claude-auto-local-first.md",
                  "references/rea-ghidra-catalog-audit-20261019.md",
                  "scripts/character_fullbody.py",
                  "templates/fullbody-demo.json",
                  "templates/fullbody-demo-words.json",
                  "references/fullbody-character-motion.md",
                  "evals/test_character_fullbody.py",
                  "scripts/character_ik.py",
                  "templates/ik-wave-demo.json",
                  "templates/ik-wave-words.json",
                  "references/character-ik-motion.md",
                  "evals/test_character_ik.py",
                  "templates/creative-paint-demo.json",
                  "references/creative-paint-runtime.md",
                  "evals/test_creative_paint.py",
                  "references/code-drawing-master.md",
                  "evals/test_code_drawing_master.py",
                  "evals/test_code_drawing_engine.mjs",
                  "scripts/motion_stack.py",
                  "scripts/motion_reference_probe.py",
                  "scripts/reference_visual_fingerprint.py",
                  "references/reference-visual-transfer.md",
                  "evals/test_reference_visual_fingerprint.py",
                  "evals/test_reference_visual_style.py",
                  "scripts/reference_edit_engine.py",
                  "scripts/creative_quality_gate.py",
                  "references/creative-quality-gates.md",
                  "evals/test_creative_quality_gate.py",
                  "scripts/music_rhythm_engine.py",
                  "references/music-rhythm-execution.md",
                  "evals/test_music_rhythm_engine.py",
                  "references/reference-edit-execution.md",
                  "evals/test_reference_edit_engine.py",
                  "assets/motion_engine.js",
                  "data/motion_sources.json",
                  "references/executable-creative-motion.md",
                  "scripts/source_scout.py",
                  "scripts/rea_bridge.py",
                  "evals/test_motion_director.py"
              ]
              root = "kosif-superpowers/"
              missing = [name for name in required if root + name not in names]
              assert not missing, f"Missing capabilities in Claude skill: {missing}"
              print(f"Verified skill bundle with {len(names)} entries and executable motion components")
          PY
      - name: Upload installable skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: kosif-superpowers-claude-skill
          path: dist/kosif-superpowers.skill
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

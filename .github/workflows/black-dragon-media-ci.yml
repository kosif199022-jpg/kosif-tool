name: Black Dragon Media Runtime CI
on:
  push:
    paths:
      - '.claude/skills/kosif-superpowers/scripts/black_dragon.py'
      - '.claude/skills/kosif-superpowers/scripts/black_dragon_media.py'
      - '.claude/skills/kosif-superpowers/scripts/audio_cue_mapper.py'
      - '.claude/skills/kosif-superpowers/scripts/music_rhythm_engine.py'
      - '.claude/skills/kosif-superpowers/scripts/montage_pro.py'
      - '.claude/skills/kosif-superpowers/scripts/cinema_lab.py'
      - 'tests/test_black_dragon_media.py'
      - '.github/workflows/black-dragon-media-ci.yml'
  pull_request:
    paths:
      - '.claude/skills/kosif-superpowers/scripts/black_dragon.py'
      - '.claude/skills/kosif-superpowers/scripts/black_dragon_media.py'
      - 'tests/test_black_dragon_media.py'
      - '.github/workflows/black-dragon-media-ci.yml'
  workflow_dispatch:

jobs:
  real-audio-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media binaries on minimal Ubuntu runners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install local media Python dependencies
        run: python3 -m pip install 'numpy>=1.26,<3'
      - name: Verify local media binaries
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Compile media scripts
        run: |
          python3 -m py_compile .claude/skills/kosif-superpowers/scripts/black_dragon.py
          python3 -m py_compile .claude/skills/kosif-superpowers/scripts/black_dragon_media.py
          python3 -m py_compile .claude/skills/kosif-superpowers/scripts/music_rhythm_engine.py
          python3 -m py_compile .claude/skills/kosif-superpowers/scripts/audio_cue_mapper.py
      - name: Run actual synthetic-audio integration and safety tests
        run: python3 -m unittest discover -s tests -p 'test_black_dragon_media.py' -v

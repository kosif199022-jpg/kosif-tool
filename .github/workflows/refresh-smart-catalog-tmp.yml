name: Rebuild smart capabilities index (temporary)
on:
  push:
    branches:
      - fix/instagram-superpowers-smart-index-20261024
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild smart index deterministically
        run: |
          python3 .claude/skills/kosif-superpowers/scripts/smart_capabilities.py build
          python3 .claude/skills/kosif-superpowers/scripts/smart_capabilities.py verify
      - name: Commit generated index data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh smart capability index for TOOL-172'
            git push origin HEAD:fix/instagram-superpowers-smart-index-20261024
          fi

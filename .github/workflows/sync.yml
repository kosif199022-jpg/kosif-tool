name: Sync catalog with source
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync and rebuild
        run: |
          python3 tools/sync_catalog.py
          python3 tools/build.py
          python3 tools/validate.py
      - name: Open a pull request when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "catalog unchanged"; exit 0; fi
          branch="catalog-sync/$(date -u +%Y-%m-%d)"
          git config user.name "kosif-tool-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Sync catalog with source ($(date -u +%Y-%m-%d))"
          git push -u origin "$branch"
          gh pr create --title "Catalog sync $(date -u +%Y-%m-%d)" --body "Automated weekly sync of PromptsMotion references (metadata and links only). Review new entries, then run \`python3 tools/import_briefs.py\` for any new styles that need briefs." --base main --head "$branch"
